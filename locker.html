<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Your Reward</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --panel-bg: #15181e;
            --neon-blue: #00e5ff;
            --neon-green: #25D366;
            --fb-blue: #1877F2;
            --neon-red: #ff3366;
            --text-main: #ffffff;
            --text-muted: #8a99a8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .locker-card {
            background-color: var(--panel-bg);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
        }
        h2 { margin-top: 0; font-size: 24px; }
        .instructions { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; line-height: 1.5; }
        
        .progress-container {
            background: #0b0d10;
            border-radius: 20px;
            height: 25px;
            width: 100%;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        .progress-fill { background: linear-gradient(90deg, var(--neon-blue), #00ffcc); height: 100%; width: 0%; transition: width 0.5s ease; }
        .progress-text { position: absolute; width: 100%; top: 0; left: 0; line-height: 25px; font-size: 12px; font-weight: bold; color: #fff; text-shadow: 0 0 5px rgba(0,0,0,0.8); }

        .btn {
            display: flex; align-items: center; justify-content: center; width: 100%; padding: 16px; margin-bottom: 15px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; color: #fff; transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-wa { background-color: var(--neon-green); box-shadow: 0 0 15px rgba(37,211,102,0.3); }
        .btn-fb { background-color: var(--fb-blue); box-shadow: 0 0 15px rgba(24,119,242,0.3); }
        .btn-unlock { background: var(--neon-green); color: #000; box-shadow: 0 0 20px rgba(37,211,102,0.4); display: none; animation: pulse 1.5s infinite; }
        .btn-verify { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px rgba(0,229,255,0.3); }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .icon { width: 20px; height: 20px; margin-right: 10px; fill: currentColor; }

        /* UPLOAD & VERIFICATION CSS */
        #uploadArea { display: none; margin-top: 10px; }
        input[type="file"] { display: none; }
        .upload-btn {
            display: block; width: 100%; padding: 16px; background: transparent;
            border: 2px dashed var(--neon-blue); color: var(--neon-blue);
            border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; box-sizing: border-box; transition: 0.3s;
        }
        .upload-btn:hover { background: rgba(0, 229, 255, 0.05); }
        .file-name { font-size: 11px; color: var(--neon-green); margin-top: 10px; margin-bottom: 15px; display: block; }
        
        /* UPDATED: Even bigger and bolder red warning text */
        .upload-warning { 
            font-size: 22px; 
            color: var(--neon-red); 
            font-weight: 900; 
            margin-bottom: 20px; 
            line-height: 1.4; 
        }

        #processingArea { display: none; padding: 20px 0; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(0,229,255,0.1);
            border-top-color: var(--neon-blue); border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 15px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-text { font-size: 13px; color: var(--neon-blue); font-weight: bold; }
    </style>
</head>
<body>

    <div class="locker-card">
        <h2 id="lockerTitle">🎁 Claim Your Reward</h2>
        <p class="instructions" id="descText">Loading secure link...</p>

        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- SHARE BUTTONS -->
        <div id="shareButtons">
            <button class="btn btn-wa" onclick="triggerShare('whatsapp')">
                <svg class="icon" viewBox="0 0 448 512"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6z"/></svg>
                Share on WhatsApp
            </button>
            <button class="btn btn-fb" onclick="triggerShare('facebook')">
                <svg class="icon" viewBox="0 0 320 512"><path d="M279.14 288l14.22-92.66h-88.91v-60.13c0-25.35 12.42-50.06 52.24-50.06h40.42V6.26S260.43 0 225.36 0c-73.22 0-121.08 44.38-121.08 124.72v70.62H22.89V288h81.39v224h100.17V288z"/></svg>
                Share on Facebook
            </button>
        </div>

        <!-- VERIFICATION UPLOAD AREA -->
        <div id="uploadArea">
            <div class="upload-warning">
                ⚠️ Please upload the screenshot of your invited friends here to get the free gift.
            </div>
            
            <label class="upload-btn">
                📸 Select Screenshot
                <input type="file" id="imageInput" accept="image/*" onchange="showFileName()">
            </label>
            <span class="file-name" id="fileNameDisplay">No image selected...</span>
            
            <button class="btn btn-verify" onclick="startVerification()">Scan & Verify Evidence</button>
        </div>

        <!-- PROCESSING SCANNER -->
        <div id="processingArea">
            <div class="spinner"></div>
            <div class="status-text" id="statusText">Uploading image...</div>
        </div>

        <!-- FINAL UNLOCK BUTTON -->
        <button class="btn btn-unlock" id="unlockBtn" onclick="claimReward()">🔓 Access Free Gift Now</button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDf9TgoWF5OK0reS_KCumqqcuSpDx02UQg",
            authDomain: "probet-syndicate.firebaseapp.com",
            databaseURL: "https://probet-syndicate-default-rtdb.firebaseio.com",
            projectId: "probet-syndicate",
            storageBucket: "probet-syndicate.firebasestorage.app",
            messagingSenderId: "418866597682",
            appId: "1:418866597682:web:847007dbaf3c40452d912b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentProgress = 0;
        let targetShares = 5;
        let finalRewardLink = "";
        let viralMessageText = "Check out this amazing platform I just found!";
        let successText = "✅ Verification complete! Click below to access.";

        // Load all custom text from Admin Dashboard
        db.ref('settings').once('value').then((snapshot) => {
            const data = snapshot.val() || {};
            if (data.requiredShares) targetShares = parseInt(data.requiredShares);
            if (data.rewardLink) finalRewardLink = data.rewardLink;
            if (data.lockerHeadline) document.getElementById('lockerTitle').innerText = data.lockerHeadline;
            if (data.lockerDescription) document.getElementById('descText').innerText = data.lockerDescription;
            if (data.viralMessage) viralMessageText = data.viralMessage;
            if (data.successMessage) successText = data.successMessage;
        });

        function triggerShare(platform) {
            let shareUrl = "";
            let encodedMessage = encodeURIComponent(viralMessageText);

            if (platform === 'whatsapp') {
                shareUrl = `https://api.whatsapp.com/send?text=${encodedMessage}`;
            } else if (platform === 'facebook') {
                shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}&quote=${encodedMessage}`;
            }
            
            window.open(shareUrl, '_blank');

            setTimeout(() => {
                let progressJump = 100 / targetShares;
                currentProgress += progressJump;

                let visualProgress = Math.round(currentProgress);

                if (visualProgress >= 100) {
                    visualProgress = 100;
                    document.getElementById('shareButtons').style.display = 'none';
                    
                    // Show Upload Area instead of Unlock Button
                    document.getElementById('uploadArea').style.display = 'block';
                    document.getElementById('descText').innerText = "Almost there! Screenshot verification required."; 
                }

                document.getElementById('progressBar').style.width = visualProgress + '%';
                document.getElementById('progressText').innerText = visualProgress + '%';
                
            }, 2000);
        }

        function showFileName() {
            const input = document.getElementById('imageInput');
            const display = document.getElementById('fileNameDisplay');
            if (input.files.length > 0) {
                display.innerText = "✔️ " + input.files[0].name;
            }
        }

        function startVerification() {
            const input = document.getElementById('imageInput');
            if (input.files.length === 0) {
                alert("Please upload a screenshot first!");
                return;
            }

            document.getElementById('uploadArea').style.display = 'none';
            document.getElementById('processingArea').style.display = 'block';

            const statusText = document.getElementById('statusText');

            setTimeout(() => { statusText.innerText = "Analyzing WhatsApp layout..."; }, 1500);
            setTimeout(() => { statusText.innerText = "Verifying share markers..."; }, 3000);
            
            setTimeout(() => {
                document.getElementById('processingArea').style.display = 'none';
                
                // Show final success text and unlock button
                document.getElementById('descText').innerText = successText; 
                document.getElementById('unlockBtn').style.display = 'block'; 
            }, 4500);
        }

        function claimReward() {
            if (finalRewardLink !== "") {
                window.location.href = finalRewardLink;
            } else {
                alert("The Admin has not set the reward link yet!");
            }
        }
    </script>
</body>
</html>
