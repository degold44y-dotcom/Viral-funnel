<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Your Free PDF</title>
    <style>
        :root {
            --bg-color: #121418;
            --panel-bg: #1a1d24;
            --neon-blue: #00e5ff;
            --neon-green: #25D366; 
            --fb-blue: #1877F2; 
            --text-main: #ffffff;
            --shadow-light: #242830;
            --shadow-dark: #101216;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .locker-box {
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
        }
        h2 {
            color: var(--neon-blue);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p.desc {
            font-size: 14px;
            color: #8a99a8;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .progress-text {
            color: var(--neon-blue);
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .progress-bar-bg {
            background-color: #101216;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            margin-bottom: 30px;
            box-shadow: inset 3px 3px 5px var(--shadow-dark), inset -3px -3px 5px var(--shadow-light);
            overflow: hidden;
        }
        .progress-fill {
            background-color: var(--neon-blue);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }
        button {
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            transition: all 0.2s ease;
        }
        button:active {
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }
        .btn-wa { background-color: var(--neon-green); }
        .btn-fb { background-color: var(--fb-blue); }
        .btn-download { 
            background-color: var(--neon-blue); 
            display: none; 
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            color: #000;
        }
    </style>
</head>
<body>

    <div class="locker-box">
        <h2>Unlock Your Free PDF</h2>
        <p class="desc">Discover the exact methods to secure employment in the UK without a university degree. Complete the steps below to unlock your guide.</p>
        
        <div class="progress-text" id="progressText">Step 1: Share to Unlock (0%)</div>
        <div class="progress-bar-bg">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <button class="btn-wa" id="waBtn" onclick="shareWhatsApp()">Share on WhatsApp</button>
        <button class="btn-fb" id="fbBtn" onclick="shareFacebook()">Share on Facebook</button>

        <button class="btn-download" id="downloadBtn" onclick="downloadPDF()">DOWNLOAD FREE PDF NOW</button>
    </div>

    <script>
        // Temporary placeholders while Firebase loads
        window.viralLink = encodeURIComponent("https://degold44y-dotcom.github.io/Viral-funnel/");
        window.fbLink = ""; 
        window.rewardLink = "#"; 

        let progress = 0;
        const shareText = encodeURIComponent("I just found this amazing free guide on how to get UK jobs without a degree! Get it here: ");

        function updateProgress() {
            progress += 50; 
            if (progress > 100) progress = 100;

            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').innerText = `Step 1: Share to Unlock (${progress}%)`;

            if (progress >= 100) {
                document.getElementById('progressText').innerText = "✅ Unlocked Successfully!";
                document.getElementById('progressText').style.color = "var(--neon-green)";
                document.getElementById('waBtn').style.display = "none";
                document.getElementById('fbBtn').style.display = "none";
                document.getElementById('downloadBtn').style.display = "block";
            }
        }

        function shareWhatsApp() {
            window.open(`https://api.whatsapp.com/send?text=${shareText}${window.viralLink}`, '_blank');
            setTimeout(updateProgress, 2000);
        }

        function shareFacebook() {
            // Checks for a Facebook specific link first, otherwise uses the WhatsApp one
            const shareUrl = window.fbLink || window.viralLink;
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${shareUrl}`, '_blank');
            setTimeout(updateProgress, 2000);
        }

        function downloadPDF() {
            if(window.rewardLink !== "#") {
                window.location.href = window.rewardLink;
            } else {
                alert("PDF link is still syncing from your dashboard. Please tap again in a second.");
            }
        }
    </script>

    <!-- Firebase Reader Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDf9TgoWF5OK0reS_KCumqqcuSpDx02UQg",
          authDomain: "probet-syndicate.firebaseapp.com",
          projectId: "probet-syndicate",
          storageBucket: "probet-syndicate.firebasestorage.app",
          messagingSenderId: "418866597682",
          appId: "1:418866597682:web:847007dbaf3c40452d912b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // This instantly overwrites the placeholders with your actual dashboard links
        async function loadDynamicLinks() {
            try {
                const docSnap = await getDoc(doc(db, "funnel", "links"));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    if (data.viral_link) {
                        window.viralLink = encodeURIComponent(data.viral_link);
                    }
                    if (data.fb_link) {
                        window.fbLink = encodeURIComponent(data.fb_link);
                    }
                    if (data.pdf_link) {
                        window.rewardLink = data.pdf_link;
                    }
                }
            } catch(e) {
                console.error("Database connection error", e);
            }
        }
        
        loadDynamicLinks();
    </script>
</body>
</html>
