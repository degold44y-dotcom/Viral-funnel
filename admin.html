<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funnel Admin Command Center</title>
    <style>
        :root {
            --bg-color: #121418;
            --panel-bg: #1a1d24;
            --neon-blue: #00e5ff;
            --neon-green: #00ff66;
            --text-main: #ffffff;
            --shadow-light: #242830;
            --shadow-dark: #101216;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .dashboard-3d {
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
        }

        h2 {
            text-align: center;
            color: var(--neon-blue);
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .input-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #8a99a8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 15px;
            background-color: var(--panel-bg);
            border: none;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }

        input:focus { 
            outline: none; 
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light), 0 0 10px rgba(0, 229, 255, 0.2); 
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            background-color: var(--panel-bg);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
        }

        button:active { 
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light); 
        }

        #status-msg {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--neon-green);
            display: none;
        }
    </style>
</head>
<body>
    <div class="dashboard-3d">
        <h2>Command Center</h2>
        
        <div class="input-group">
            <label>1. Lead Magnet (PDF Link)</label>
            <input type="text" id="pdfLinkInput" placeholder="Link to your free gift...">
        </div>

        <div class="input-group">
            <label>2. WhatsApp Message Link</label>
            <input type="text" id="viralLinkInput" placeholder="Sent to their WA contacts...">
        </div>

        <div class="input-group">
            <label>3. Facebook Share Link</label>
            <input type="text" id="fbLinkInput" placeholder="e.g. Your wa.me capture link...">
        </div>

        <button onclick="updateFunnel()">Update Live Funnel</button>
        <p id="status-msg">✅ Funnel Successfully Updated!</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDf9TgoWF5OK0reS_KCumqqcuSpDx02UQg",
          authDomain: "probet-syndicate.firebaseapp.com",
          projectId: "probet-syndicate",
          storageBucket: "probet-syndicate.firebasestorage.app",
          messagingSenderId: "418866597682",
          appId: "1:418866597682:web:847007dbaf3c40452d912b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.updateFunnel = async function() {
            const pdfLink = document.getElementById('pdfLinkInput').value;
            const viralLink = document.getElementById('viralLinkInput').value;
            const fbLink = document.getElementById('fbLinkInput').value;
            const statusMsg = document.getElementById('status-msg');

            statusMsg.textContent = "⏳ Updating database...";
            statusMsg.style.color = "var(--neon-blue)";
            statusMsg.style.display = "block";

            try {
                await setDoc(doc(db, "funnel", "links"), {
                    ...(pdfLink && { pdf_link: pdfLink }),
                    ...(viralLink && { viral_link: viralLink }),
                    ...(fbLink && { fb_link: fbLink })
                }, { merge: true });

                statusMsg.textContent = "✅ Live Funnel Successfully Updated!";
                statusMsg.style.color = "var(--neon-green)";
                
                document.getElementById('pdfLinkInput').value = '';
                document.getElementById('viralLinkInput').value = '';
                document.getElementById('fbLinkInput').value = '';
                
                setTimeout(() => { statusMsg.style.display = "none"; }, 4000);
            } catch (error) {
                console.error(error);
                statusMsg.textContent = "❌ Error connecting to database.";
                statusMsg.style.color = "#ff3333";
            }
        };
    </script>
</body>
</html>
