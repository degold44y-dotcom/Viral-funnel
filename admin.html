<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro OTC | Admin Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --panel-bg: #15181e;
            --card-bg: #1c2028;
            --neon-blue: #00e5ff;
            --neon-green: #00ff66;
            --neon-red: #ff3366;
            --neon-purple: #b52aff;
            --neon-gold: #ffd700;
            --text-main: #ffffff;
            --text-muted: #8a99a8;
        }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        .dashboard-ui {
            background-color: var(--panel-bg); border-radius: 24px; padding: 30px;
            width: 100%; max-width: 460px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05); text-align: left;
        }
        h2 {
            margin-top: 0; margin-bottom: 5px; text-transform: uppercase;
            letter-spacing: 2px; font-size: 20px; font-weight: 900; color: var(--neon-gold);
            text-align: center;
        }
        .subtitle {
            font-size: 11px; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 25px; font-weight: bold; text-align: center;
        }
        .card {
            background: var(--card-bg); border-radius: 16px; padding: 20px;
            border: 1px solid rgba(255,255,255,0.02); box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin-bottom: 15px;
        }
        label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: bold; display: block; margin-bottom: 8px; }
        input[type="text"] {
            width: 100%; padding: 14px; background: #0b0d10; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; margin-bottom: 15px;
        }
        button {
            width: 100%; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: bold;
            text-transform: uppercase; cursor: pointer; border: none; transition: 0.2s;
        }
        .btn-save { background: var(--neon-gold); color: #000; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .btn-save:active { transform: scale(0.98); }
        .status-msg { font-size: 12px; color: var(--neon-green); text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="dashboard-ui">
        <h2>Admin Command Hub</h2>
        <div class="subtitle">Strict OTC Matrix Control</div>

        <div class="card">
            <label>Subscription Price Display (e.g. $2.00 or ₦2,500)</label>
            <input type="text" id="adminPriceInput" placeholder="$2.00">

            <label>VIP License Key (Master Pass)</label>
            <input type="text" id="adminKeyInput" placeholder="PRO-OTC-777">

            <label>Payment Gateway URL</label>
            <input type="text" id="adminPaymentLink" placeholder="https://selar.co/your-product">

            <button class="btn-save" onclick="saveSettings()">Save Configuration</button>
            <div class="status-msg" id="statusMsg">✔️ Settings saved to Firebase!</div>
        </div>

        <div style="text-align: center; margin-top: 15px;">
            <a href="otc-scanner.html" target="_blank" style="color: var(--neon-blue); font-size: 12px; text-decoration: none; font-weight: bold;">
                🔗 Open Live Scanner App
            </a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDf9TgoWF5OK0reS_KCumqqcuSpDx02UQg",
            authDomain: "probet-syndicate.firebaseapp.com",
            databaseURL: "https://probet-syndicate-default-rtdb.firebaseio.com",
            projectId: "probet-syndicate",
            storageBucket: "probet-syndicate.firebasestorage.app",
            messagingSenderId: "418866597682",
            appId: "1:418866597682:web:847007dbaf3c40452d912b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Load settings from Firebase on startup
        db.ref('adminSettings').once('value').then((snapshot) => {
            const data = snapshot.val() || {};
            if (data.price) document.getElementById('adminPriceInput').value = data.price;
            if (data.vipKey) document.getElementById('adminKeyInput').value = data.vipKey;
            if (data.paymentUrl) document.getElementById('adminPaymentLink').value = data.paymentUrl;
        });

        function saveSettings() {
            const newPrice = document.getElementById('adminPriceInput').value.trim();
            const newKey = document.getElementById('adminKeyInput').value.trim();
            const newLink = document.getElementById('adminPaymentLink').value.trim();

            db.ref('adminSettings').set({
                price: newPrice || "$2.00",
                vipKey: newKey || "PRO-OTC-777",
                paymentUrl: newLink || "https://selar.com"
            }).then(() => {
                const msg = document.getElementById('statusMsg');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
            }).catch((error) => {
                alert("Error saving settings: " + error.message);
            });
        }
    </script>
</body>
</html>
