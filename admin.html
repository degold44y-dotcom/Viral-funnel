<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadSprint - Command Center</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --panel-bg: #15181e;
            --card-bg: #1c2028;
            --neon-blue: #00e5ff;
            --neon-purple: #b52aff;
            --text-main: #ffffff;
            --text-muted: #8a99a8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .dashboard-ui {
            background-color: var(--panel-bg);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
        }
        h2 {
            text-align: center;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 20px;
            font-weight: 800;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.02);
            max-height: 60vh;
            overflow-y: auto;
        }
        /* Custom Scrollbar for the card */
        .card::-webkit-scrollbar { width: 6px; }
        .card::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.3); border-radius: 10px; }
        
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 15px;
        }
        label:first-child { margin-top: 0; }
        input, textarea {
            width: 100%;
            padding: 14px 12px;
            background-color: #0b0d10;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.2s;
        }
        textarea { height: 70px; resize: none; }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
        }
        button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px rgba(0,229,255,0.3);
        }
        button:active { transform: scale(0.98); }
        .toast { display: none; text-align: center; color: #00ff66; font-size: 13px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="dashboard-ui">
        <h2>System Command Center</h2>
        
        <div class="card">
            <label>1. Final Reward URL (Link to Gift)</label>
            <input type="url" id="rewardLink" placeholder="https://your-website.com/your-free-gift">

            <label>2. Required Shares to Unlock</label>
            <input type="number" id="requiredShares" placeholder="e.g., 5">

            <label>3. Locker Headline</label>
            <input type="text" id="lockerHeadline" placeholder="🎁 Claim Your Reward">

            <label>4. Locker Instructions</label>
            <textarea id="lockerDescription" placeholder="Tap the share buttons below to unlock your reward..."></textarea>

            <label>5. Viral Share Message (WhatsApp Text)</label>
            <textarea id="viralMessage" placeholder="Check out this amazing platform I just found!"></textarea>
            
            <label>6. Success Message (Shows at 100%)</label>
            <input type="text" id="successMessage" placeholder="✅ Verification complete! Click below to access.">
        </div>

        <button onclick="saveSettings()">Save & Update Live Funnel</button>
        <div class="toast" id="successMsg">✅ Live Funnel Updated Successfully!</div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDf9TgoWF5OK0reS_KCumqqcuSpDx02UQg",
            authDomain: "probet-syndicate.firebaseapp.com",
            databaseURL: "https://probet-syndicate-default-rtdb.firebaseio.com",
            projectId: "probet-syndicate",
            storageBucket: "probet-syndicate.firebasestorage.app",
            messagingSenderId: "418866597682",
            appId: "1:418866597682:web:847007dbaf3c40452d912b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Load existing settings
        db.ref('settings').once('value').then((snapshot) => {
            const data = snapshot.val() || {};
            document.getElementById('rewardLink').value = data.rewardLink || '';
            document.getElementById('requiredShares').value = data.requiredShares || 5;
            document.getElementById('lockerHeadline').value = data.lockerHeadline || '🎁 Claim Your Reward';
            document.getElementById('lockerDescription').value = data.lockerDescription || 'Tap the buttons below to share 5 times to unlock your reward.';
            document.getElementById('viralMessage').value = data.viralMessage || 'Check out this amazing platform I just found!';
            document.getElementById('successMessage').value = data.successMessage || '✅ Verification complete! Click below to access.';
        });

        // Save settings to database
        function saveSettings() {
            const btn = document.querySelector('button');
            btn.innerText = "Saving...";
            
            db.ref('settings').update({
                rewardLink: document.getElementById('rewardLink').value,
                requiredShares: parseInt(document.getElementById('requiredShares').value) || 5,
                lockerHeadline: document.getElementById('lockerHeadline').value,
                lockerDescription: document.getElementById('lockerDescription').value,
                viralMessage: document.getElementById('viralMessage').value,
                successMessage: document.getElementById('successMessage').value
            }).then(() => {
                btn.innerText = "Save & Update Live Funnel";
                const toast = document.getElementById('successMsg');
                toast.style.display = 'block';
                setTimeout(() => toast.style.display = 'none', 3000);
            });
        }
    </script>
</body>
</html>
