<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funnel Admin Command Center</title>
    <style>
        :root {
            --bg-color: #121418;
            --panel-bg: #1a1d24;
            --neon-blue: #00e5ff;
            --neon-green: #00ff66;
            --text-main: #ffffff;
            --shadow-light: #242830;
            --shadow-dark: #101216;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .dashboard-3d {
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
        }
        h2, h3 {
            text-align: center;
            color: var(--neon-blue);
            margin-bottom: 20px;
        }
        h3 { font-size: 16px; margin-top: 30px; color: #8a99a8; text-transform: uppercase; letter-spacing: 1px;}
        
        .input-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #8a99a8;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: var(--panel-bg);
            border: none;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }
        input:focus { outline: none; box-shadow: inset 2px 2px 5px var(--shadow-dark), 0 0 10px rgba(0, 229, 255, 0.2); }
        button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            background-color: var(--panel-bg);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
        }
        button:active { box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light); }
        #status-msg { text-align: center; margin-top: 20px; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="dashboard-3d">
        <h2>Command Center</h2>
        
        <h3>🔗 System Links</h3>
        <div class="input-group">
            <label>1. Lead Magnet (Reward Link)</label>
            <input type="text" id="pdfLinkInput" placeholder="Link to free gift, video, or PDF...">
        </div>
        <div class="input-group">
            <label>2. Locker Share Link (Landing Page URL)</label>
            <input type="text" id="viralLinkInput" placeholder="e.g. your index.html link...">
        </div>
        <div class="input-group">
            <label>3. Landing Page Button (WA.ME Link)</label>
            <input type="text" id="fbLinkInput" placeholder="Your wa.me capture link...">
        </div>

        <h3>📝 Landing Page Content</h3>
        <div class="input-group"><label>Main Headline</label><input type="text" id="mainTitleInput" placeholder="e.g. How to Relocate..."></div>
        <div class="input-group"><label>3D Book Title</label><input type="text" id="bookTitleInput" placeholder="e.g. UK Jobs Blueprint"></div>
        <div class="input-group"><label>3D Book Subtitle</label><input type="text" id="bookSubInput" placeholder="e.g. No Degree Required"></div>
        <div class="input-group"><label>Bullet Point 1</label><input type="text" id="feat1Input" placeholder="Benefit 1..."></div>
        <div class="input-group"><label>Bullet Point 2</label><input type="text" id="feat2Input" placeholder="Benefit 2..."></div>
        <div class="input-group"><label>Bullet Point 3</label><input type="text" id="feat3Input" placeholder="Benefit 3..."></div>

        <h3>🔒 Locker Page Content</h3>
        <div class="input-group"><label>Locker Headline</label><input type="text" id="lockerTitleInput" placeholder="e.g. Unlock Your Free Gift"></div>
        <div class="input-group"><label>Locker Page Description</label><input type="text" id="lockerDescInput" placeholder="e.g. Complete the steps below to unlock..."></div>
        <div class="input-group"><label>WhatsApp Share Message</label><input type="text" id="shareMessageInput" placeholder="e.g. I just found this amazing guide! Get it here:"></div>
        <div class="input-group"><label>Final Button Text</label><input type="text" id="lockerBtnInput" placeholder="e.g. Access Now..."></div>

        <button onclick="updateFunnel()">Update Live Funnel</button>
        <p id="status-msg">✅ Funnel Successfully Updated!</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDf9TgoWF5OK0reS_KCumqqcuSpDx02UQg",
          authDomain: "probet-syndicate.firebaseapp.com",
          projectId: "probet-syndicate",
          storageBucket: "probet-syndicate.firebasestorage.app",
          messagingSenderId: "418866597682",
          appId: "1:418866597682:web:847007dbaf3c40452d912b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.updateFunnel = async function() {
            const statusMsg = document.getElementById('status-msg');
            statusMsg.textContent = "⏳ Updating database...";
            statusMsg.style.color = "var(--neon-blue)";
            statusMsg.style.display = "block";

            const dataToSave = {};
            const fields = [
                'pdfLink', 'viralLink', 'fbLink', 'mainTitle', 'bookTitle', 'bookSub', 
                'feat1', 'feat2', 'feat3', 'lockerTitle', 'lockerDesc', 'shareMessage', 'lockerBtn'
            ];
            
            fields.forEach(field => {
                const val = document.getElementById(field + 'Input').value;
                if (val) dataToSave[field] = val; 
            });

            try {
                await setDoc(doc(db, "funnel", "content"), dataToSave, { merge: true });
                statusMsg.textContent = "✅ Live Funnel Successfully Updated!";
                statusMsg.style.color = "var(--neon-green)";
                
                fields.forEach(field => document.getElementById(field + 'Input').value = '');
                setTimeout(() => { statusMsg.style.display = "none"; }, 4000);
            } catch (error) {
                statusMsg.textContent = "❌ Error connecting to database.";
                statusMsg.style.color = "#ff3333";
            }
        };
    </script>
</body>
</html>
