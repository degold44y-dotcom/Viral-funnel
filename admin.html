<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin | Unified Command Hub</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --panel-bg: #15181e;
            --card-bg: #1c2028;
            --neon-blue: #00e5ff;
            --neon-green: #00ff66;
            --neon-purple: #b52aff;
            --neon-gold: #ffd700;
            --text-main: #ffffff;
            --text-muted: #8a99a8;
        }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }
        .dashboard-ui {
            background-color: var(--panel-bg); border-radius: 24px; padding: 30px;
            width: 100%; max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05); text-align: left;
        }
        h2 {
            margin-top: 0; margin-bottom: 5px; text-transform: uppercase;
            letter-spacing: 2px; font-size: 20px; font-weight: 900; color: var(--neon-gold);
            text-align: center;
        }
        .subtitle {
            font-size: 11px; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 25px; font-weight: bold; text-align: center;
        }
        .card {
            background: var(--card-bg); border-radius: 16px; padding: 20px;
            border: 1px solid rgba(255,255,255,0.02); box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin-bottom: 20px;
        }
        .card-title {
            font-size: 13px; font-weight: bold; color: var(--neon-blue); text-transform: uppercase;
            margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px;
        }
        label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: bold; display: block; margin-bottom: 6px; }
        input[type="text"], input[type="number"] {
            width: 100%; padding: 12px; background: #0b0d10; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #fff; font-size: 13px; box-sizing: border-box; margin-bottom: 12px;
        }
        button {
            width: 100%; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: bold;
            text-transform: uppercase; cursor: pointer; border: none; transition: 0.2s;
        }
        .btn-save-otc { background: var(--neon-gold); color: #000; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
        .btn-save-locker { background: var(--neon-purple); color: #fff; box-shadow: 0 0 15px rgba(181, 42, 255, 0.3); }
        .btn-admin-bypass { background: var(--neon-green); color: #000; box-shadow: 0 0 15px rgba(0,255,102,0.3); margin-top: 10px; }
        button:active { transform: scale(0.98); }
        .status-msg { font-size: 11px; color: var(--neon-green); text-align: center; margin-top: 8px; display: none; }
    </style>
</head>
<body>

    <div class="dashboard-ui">
        <h2>Unified Command Hub</h2>
        <div class="subtitle">Content Locker & OTC Matrix Control</div>

        <!-- STRICT OTC MATRIX SETTINGS -->
        <div class="card">
            <div class="card-title">📊 Strict OTC Matrix Settings</div>
            
            <label>Subscription Price Display</label>
            <input type="text" id="otcPriceInput" placeholder="$2.00">

            <label>VIP License Key (Master Pass)</label>
            <input type="text" id="otcKeyInput" placeholder="PRO-OTC-777">

            <label>Payment Gateway URL</label>
            <input type="text" id="otcPaymentLink" placeholder="https://your-payment-link.com">

            <label>Execution Second (e.g. 57 for 9m 57s)</label>
            <input type="number" id="otcExecSecond" placeholder="57">

            <button class="btn-save-otc" onclick="saveOTCSettings()">Save OTC Settings</button>
            <div class="status-msg" id="otcStatus">✔️ OTC Settings saved successfully!</div>

            <!-- ADMIN BYPASS BUTTON -->
            <button class="btn-admin-bypass" onclick="grantAdminAccess()">👑 Activate Admin Free Access on this Device</button>
            <div class="status-msg" id="adminStatus" style="color: var(--neon-blue);">✔️ Admin VIP Unlocked on this browser!</div>
        </div>

        <!-- CONTENT LOCKER SETTINGS -->
        <div class="card">
            <div class="card-title">🎁 Content Locker Settings</div>
            
            <label>Locker Headline (Title)</label>
            <input type="text" id="lockerHeadline" placeholder="🎁 Claim Your Reward">

            <label>Description / Instructions</label>
            <input type="text" id="lockerDescription" placeholder="Loading secure link...">

            <label>Required Shares Count</label>
            <input type="text" id="requiredShares" placeholder="5">

            <label>Viral Share Message Text</label>
            <input type="text" id="viralMessage" placeholder="Check out this amazing platform...">

            <label>Success Message After Verification</label>
            <input type="text" id="successMessage" placeholder="✅ Verification complete!">

            <label>Final Reward Target URL</label>
            <input type="text" id="rewardLink" placeholder="https://your-final-link.com">

            <button class="btn-save-locker" onclick="saveLockerSettings()">Save Locker Settings</button>
            <div class="status-msg" id="lockerStatus">✔️ Locker Settings saved successfully!</div>
        </div>

        <div style="text-align: center; display: flex; justify-content: space-around; margin-top: 10px;">
            <a href="otc-scanner.html" target="_blank" style="color: var(--neon-blue); font-size: 11px; text-decoration: none; font-weight: bold;">
                🔗 Open OTC App
            </a>
            <a href="locker.html" target="_blank" style="color: var(--neon-purple); font-size: 11px; text-decoration: none; font-weight: bold;">
                🔗 Open Locker App
            </a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDf9TgoWF5OK0reS_KCumqqcuSpDx02UQg",
            authDomain: "probet-syndicate.firebaseapp.com",
            databaseURL: "https://probet-syndicate-default-rtdb.firebaseio.com",
            projectId: "probet-syndicate",
            storageBucket: "probet-syndicate.firebasestorage.app",
            messagingSenderId: "418866597682",
            appId: "1:418866597682:web:847007dbaf3c40452d912b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Load OTC settings on startup
        db.ref('adminSettings/otc').once('value').then((snapshot) => {
            const data = snapshot.val() || {};
            if (data.price) document.getElementById('otcPriceInput').value = data.price;
            if (data.vipKey) document.getElementById('otcKeyInput').value = data.vipKey;
            if (data.paymentUrl) document.getElementById('otcPaymentLink').value = data.paymentUrl;
            if (data.execSecond !== undefined) document.getElementById('otcExecSecond').value = data.execSecond;
        });

        // Load Content Locker settings on startup
        db.ref('settings').once('value').then((snapshot) => {
            const data = snapshot.val() || {};
            if (data.requiredShares) document.getElementById('requiredShares').value = data.requiredShares;
            if (data.rewardLink) document.getElementById('rewardLink').value = data.rewardLink;
            if (data.lockerHeadline) document.getElementById('lockerHeadline').value = data.lockerHeadline;
            if (data.lockerDescription) document.getElementById('lockerDescription').value = data.lockerDescription;
            if (data.viralMessage) document.getElementById('viralMessage').value = data.viralMessage;
            if (data.successMessage) document.getElementById('successMessage').value = data.successMessage;
        });

        // Save OTC Settings
        function saveOTCSettings() {
            const price = document.getElementById('otcPriceInput').value.trim();
            const vipKey = document.getElementById('otcKeyInput').value.trim();
            const paymentUrl = document.getElementById('otcPaymentLink').value.trim();
            const execSecond = document.getElementById('otcExecSecond').value.trim();

            db.ref('adminSettings/otc').update({
                price: price || "$2.00",
                vipKey: vipKey || "PRO-OTC-777",
                paymentUrl: paymentUrl || "https://selar.com",
                execSecond: execSecond ? parseInt(execSecond) : 57
            }).then(() => {
                const msg = document.getElementById('otcStatus');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
            });
        }

        // Instant Admin Free Access Activation for this browser
        function grantAdminAccess() {
            localStorage.setItem('ls_is_vip', 'true');
            localStorage.setItem('ls_disclaimer_accepted', 'true');
            const msg = document.getElementById('adminStatus');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 3000);
        }

        // Save Content Locker Settings
        function saveLockerSettings() {
            const requiredShares = document.getElementById('requiredShares').value.trim();
            const rewardLink = document.getElementById('rewardLink').value.trim();
            const lockerHeadline = document.getElementById('lockerHeadline').value.trim();
            const lockerDescription = document.getElementById('lockerDescription').value.trim();
            const viralMessage = document.getElementById('viralMessage').value.trim();
            const successMessage = document.getElementById('successMessage').value.trim();

            db.ref('settings').set({
                requiredShares: requiredShares ? parseInt(requiredShares) : 5,
                rewardLink: rewardLink || "",
                lockerHeadline: lockerHeadline || "🎁 Claim Your Reward",
                lockerDescription: lockerDescription || "Loading secure link...",
                viralMessage: viralMessage || "Check out this amazing platform I just found!",
                successMessage: successMessage || "✅ Verification complete! Click below to access."
            }).then(() => {
                const msg = document.getElementById('lockerStatus');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
            });
        }
    </script>
</body>
</html>
