<script type="module">
    // Import Firebase modules for web
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Your exact ProBet Syndicate Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDf9TgoWF5OK0reS_KCumqqcuSpDx02UQg",
      authDomain: "probet-syndicate.firebaseapp.com",
      projectId: "probet-syndicate",
      storageBucket: "probet-syndicate.firebasestorage.app",
      messagingSenderId: "418866597682",
      appId: "1:418866597682:web:847007dbaf3c40452d912b"
    };

    // Initialize Firebase and Firestore Database
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Make the update function trigger when you tap the button
    window.updateFunnel = async function() {
        const pdfLink = document.getElementById('pdfLinkInput').value;
        const viralLink = document.getElementById('viralLinkInput').value;
        const statusMsg = document.getElementById('status-msg');

        if (!pdfLink && !viralLink) {
            statusMsg.textContent = "⚠️ Please enter at least one link.";
            statusMsg.style.color = "#ffdd00";
            statusMsg.style.display = "block";
            return;
        }

        statusMsg.textContent = "⏳ Pushing updates to live funnel...";
        statusMsg.style.color = "var(--neon-blue)";
        statusMsg.style.display = "block";

        try {
            // Securely write the new links to your database
            await setDoc(doc(db, "funnel", "links"), {
                ...(pdfLink && { pdf_link: pdfLink }),
                ...(viralLink && { viral_link: viralLink })
            }, { merge: true });

            statusMsg.textContent = "✅ Live Funnel Successfully Updated!";
            statusMsg.style.color = "var(--neon-green)";
            
            // Clear the boxes after successful update
            document.getElementById('pdfLinkInput').value = '';
            document.getElementById('viralLinkInput').value = '';
            
            setTimeout(() => { statusMsg.style.display = "none"; }, 4000);
        } catch (error) {
            console.error(error);
            statusMsg.textContent = "❌ Error: Could not connect to database.";
            statusMsg.style.color = "#ff3333";
        }
    };
</script>
