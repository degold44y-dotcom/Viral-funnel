<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Match Engine</title>
    
    <!-- FIREBASE CLOUD DATABASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        /* Immersive Lovable Theme with 3D Lovers Background */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0c0b1a; 
            background-image: linear-gradient(rgba(12, 11, 26, 0.82), rgba(12, 11, 26, 0.94)), url('https://lh3.googleusercontent.com/d/1Bf2wR37uPjVpCTh2m7kYv0YfCgX7C1eH'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
            color: #f8fafc; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        
        /* Glassmorphism Romantic Header */
        .header { 
            width: 100%; 
            padding: 24px; 
            text-align: center; 
            background: rgba(30, 27, 56, 0.45); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 105, 180, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4); 
        }
        .header h2 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff4e50, #f9d423, #e14eca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(225, 78, 202, 0.4);
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #ec4899;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Nav Tabs & Container */
        .tabs { display: flex; justify-content: center; width: 90%; max-width: 400px; margin-top: 25px; background: rgba(15, 12, 30, 0.7); border-radius: 30px; padding: 4px; border: 1px solid rgba(255,255,255,0.05); }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border-radius: 25px; color: #94a3b8; font-weight: bold; transition: all 0.3s ease; font-size: 14px; }
        .tab.active { background: linear-gradient(135deg, #ff1493, #8a2be2); color: white; box-shadow: 0 4px 15px rgba(255, 20, 147, 0.35); }
        
        .container { width: 90%; max-width: 400px; margin-top: 25px; display: none; background: rgba(20, 17, 39, 0.65); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); padding: 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px rgba(0,0,0,0.5); box-sizing: border-box; margin-bottom: 40px; }
        .container.active { display: block; animation: fadeIn 0.4s ease-in-out; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #cbd5e1; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(30, 27, 56, 0.8); color: white; box-sizing: border-box; font-size: 15px; transition: all 0.3s ease; }
        input:focus, select:focus { outline: none; border-color: #ff69b4; box-shadow: 0 0 8px rgba(255, 105, 180, 0.3); }
        
        /* Vibrant Love Call-to-Action buttons */
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #ff1493, #e14eca); color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(225, 78, 202, 0.3); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(225, 78, 202, 0.5); }
        .btn:active { transform: translateY(0); }
        
        /* Liveness Circular Camera Feed overlay styling */
        #scanner-container { display: none; flex-direction: column; align-items: center; margin-top: 20px; position: relative; }
        #video-feed { width: 230px; height: 230px; object-fit: cover; border-radius: 50%; border: 4px solid rgba(255, 20, 147, 0.5); transform: scaleX(-1); box-shadow: 0 0 30px rgba(255, 20, 147, 0.2); }
        #canvas-capture { display: none; }
        #scanner-instructions { margin-top: 18px; font-weight: 600; color: #ff69b4; font-size: 16px; text-align: center; height: 25px; transition: 0.3s; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .scan-overlay { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 230px; height: 230px; border-radius: 50%; border: 4px dashed #ff1493; animation: spin 5s linear infinite; pointer-events: none; }
        @keyframes spin { 100% { transform: translateX(-50%) rotate(360deg); } }
        
        /* Blur-to-Focus Premium matchmaking cards with card glow */
        .match-card { background: rgba(30, 27, 56, 0.6); border-radius: 16px; padding: 20px; margin-top: 20px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .match-img { width: 100%; height: 260px; object-fit: cover; border-radius: 12px; filter: blur(16px); pointer-events: none; user-select: none; border: 1px solid rgba(255,255,255,0.05); }
        
        /* Custom overlays & Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 10, 20, 0.9); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
        .modal-content { background: #1a162e; padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 350px; border: 1px solid rgba(255, 20, 147, 0.2); box-shadow: 0 0 30px rgba(0,0,0,0.6); }
        .modal-content h3 { color: #ff1493; margin-top: 0; font-size: 20px; }
        .modal-btn { background: linear-gradient(135deg, #ff1493, #e14eca); color: white; padding: 12px 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; box-shadow: 0 4px 10px rgba(255,20,147,0.3); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Global Match Engine</h2>
        <p>❤️ Live Verification Network</p>
    </div>

    <div class="tabs">
        <div class="tab active" id="tab-find" onclick="switchTab('find')">Find a Match</div>
        <div class="tab" id="tab-join" onclick="switchTab('join')">Create Profile</div>
    </div>

    <!-- FIND A MATCH SECTION -->
    <div id="section-find" class="container active">
        <div class="form-group">
            <label>I am looking for a:</label>
            <select id="search-gender">
                <option value="Female">Female</option>
                <option value="Male">Male</option>
            </select>
        </div>
        <div class="form-group">
            <label>Location (Country):</label>
            <select id="search-country" class="country-dropdown">
                <option value="" disabled selected>Select country</option>
            </select>
        </div>
        
        <button class="btn" onclick="attemptSearch()">Scan Live Network</button>
        
        <div id="results-area" style="display: none; margin-top: 20px;">
            <h3 style="text-align: center; color: #10b981; font-size:18px; margin-bottom:15px;">🟢 Matches Connected</h3>
            <div id="match-list"></div>
        </div>
    </div>

    <!-- CREATE PROFILE SECTION -->
    <div id="section-join" class="container">
        <div class="form-group">
            <label>First Name</label>
            <input type="text" id="join-name" placeholder="Enter your first name">
        </div>
        <div class="form-group">
            <label>Your Age</label>
            <select id="join-age"><option value="" disabled selected>Age</option></select>
        </div>
        <div class="form-group">
            <label>Gender</label>
            <select id="join-gender">
                <option value="Female">Female</option>
                <option value="Male">Male</option>
            </select>
        </div>
        <div class="form-group">
            <label>Country of Residence</label>
            <select id="join-country" class="country-dropdown">
                <option value="" disabled selected>Select country</option>
            </select>
        </div>
        <div class="form-group">
            <label>WhatsApp Number</label>
            <input type="tel" id="join-whatsapp" placeholder="e.g. +1234567890">
        </div>
        
        <!-- LIVENESS SCANNER -->
        <button class="btn" id="start-scan-btn" style="background: linear-gradient(135deg, #10b981, #059669); margin-bottom: 5px;" onclick="startLivenessScan()">📸 Start Facial Verification</button>
        
        <div id="scanner-container">
            <video id="video-feed" autoplay playsinline></video>
            <div class="scan-overlay" id="scan-ring"></div>
            <p id="scanner-instructions">Position face in the circle...</p>
            <canvas id="canvas-capture" width="400" height="400"></canvas>
            <img id="final-photo" style="display:none; width:230px; height:230px; border-radius:50%; border:4px solid #10b981; object-fit:cover; transform:scaleX(-1);">
            <button class="btn" id="retake-btn" style="display:none; background: #ef4444; margin-top:10px;" onclick="startLivenessScan()">🔄 Retake</button>
        </div>

        <p id="photo-status" style="color:#10b981; font-weight:600; font-size:14px; text-align:center; display:none; margin-top:10px;">✅ Identity Verified</p>

        <button class="btn" id="submit-btn" onclick="submitProfile()" style="margin-top:25px; background: linear-gradient(135deg, #8a2be2, #e14eca);">Submit Profile & Join Network</button>
    </div>

    <!-- INTERCEPT MODAL -->
    <div id="intercept-modal" class="modal">
        <div class="modal-content">
            <h3>Verification Required</h3>
            <p>You must add your live profile to the global network before you can view and unlock other members. It's only fair!</p>
            <button class="modal-btn" onclick="closeModalAndJoin()">Create Profile</button>
        </div>
    </div>

    <script>
        // 1. INITIALIZE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAMuWAC8kNbGPdmlkngHUA7yG_f0vB_l4U",
            authDomain: "global-match-99b4e.firebaseapp.com",
            databaseURL: "https://global-match-99b4e-default-rtdb.firebaseio.com",
            projectId: "global-match-99b4e",
            storageBucket: "global-match-99b4e.firebasestorage.app",
            messagingSenderId: "816808980244",
            appId: "1:816808980244:web:832c3852ead2b707bb9c01"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. COMPLETE GLOBAL COUNTRIES LIST (ALL UN COUNTRIES + COMMONLY USED)
        const globalCountries = [
            "Afghanistan", "Albania", "Algeria", "Andorra", "Angola", "Antigua & Barbuda", "Argentina", "Armenia", "Australia", "Austria", "Azerbaijan",
            "Bahamas", "Bahrain", "Bangladesh", "Barbados", "Belarus", "Belgium", "Belize", "Benin", "Bhutan", "Bolivia", "Bosnia & Herzegovina", "Botswana", "Brazil", "Brunei", "Bulgaria", "Burkina Faso", "Burundi",
            "Cabo Verde", "Cambodia", "Cameroon", "Canada", "Central African Republic", "Chad", "Chile", "China", "Colombia", "Comoros", "Congo (Congo-Brazzaville)", "Congo (Democratic Republic)", "Costa Rica", "Croatia", "Cuba", "Cyprus", "Czechia",
            "Denmark", "Djibouti", "Dominica", "Dominican Republic",
            "Ecuador", "Egypt", "El Salvador", "Equatorial Guinea", "Eritrea", "Estonia", "Eswatini", "Ethiopia",
            "Fiji", "Finland", "France",
            "Gabon", "Gambia", "Georgia", "Germany", "Ghana", "Greece", "Grenada", "Guatemala", "Guinea", "Guinea-Bissau", "Guyana",
            "Haiti", "Honduras", "Hungary",
            "Iceland", "India", "Indonesia", "Iran", "Iraq", "Ireland", "Israel", "Italy", "Ivory Coast",
            "Jamaica", "Japan", "Jordan",
            "Kazakhstan", "Kenya", "Kiribati", "Kosovo", "Kuwait", "Kyrgyzstan",
            "Laos", "Latvia", "Lebanon", "Lesotho", "Liberia", "Libya", "Liechtenstein", "Lithuania", "Luxembourg",
            "Madagascar", "Malawi", "Malaysia", "Maldives", "Mali", "Malta", "Marshall Islands", "Mauritania", "Mauritius", "Mexico", "Micronesia", "Moldova", "Monaco", "Mongolia", "Montenegro", "Morocco", "Mozambique", "Myanmar",
            "Namibia", "Nauru", "Nepal", "Netherlands", "New Zealand", "Nicaragua", "Niger", "Nigeria", "North Korea", "North Macedonia", "Norway",
            "Oman",
            "Pakistan", "Palau", "Palestine", "Panama", "Papua New Guinea", "Paraguay", "Peru", "Philippines", "Poland", "Portugal",
            "Qatar",
            "Romania", "Russia", "Rwanda",
            "Saint Kitts & Nevis", "Saint Lucia", "Samoa", "San Marino", "Sao Tome & Principe", "Saudi Arabia", "Senegal", "Serbia", "Seychelles", "Sierra Leone", "Singapore", "Slovakia", "Slovenia", "Solomon Islands", "Somalia", "South Africa", "South Korea", "South Sudan", "Spain", "Sri Lanka", "Sudan", "Suriname", "Sweden", "Switzerland", "Syria",
            "Taiwan", "Tajikistan", "Tanzania", "Thailand", "Timor-Leste", "Togo", "Tonga", "Trinidad & Tobago", "Tunisia", "Turkey", "Turkmenistan", "Tuvalu",
            "Uganda", "Ukraine", "United Arab Emirates", "United Kingdom", "United States", "Uruguay", "Uzbekistan",
            "Vanuatu", "Vatican City", "Venezuela", "Vietnam",
            "Yemen",
            "Zambia", "Zimbabwe"
        ];

        // Inject All Global Countries
        const countryDropdowns = document.querySelectorAll('.country-dropdown');
        countryDropdowns.forEach(dropdown => {
            globalCountries.forEach(country => {
                let option = document.createElement('option'); 
                option.value = country; 
                option.innerText = country;
                dropdown.appendChild(option);
            });
        });

        const ageDropdown = document.getElementById('join-age');
        for(let i = 18; i <= 75; i++) {
            let option = document.createElement('option'); option.value = i; option.innerText = i;
            ageDropdown.appendChild(option);
        }

        // Tab Switching
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`section-${tab}`).classList.add('active');
        }

        function closeModalAndJoin() {
            document.getElementById('intercept-modal').style.display = 'none';
            switchTab('join');
        }

        // LIVENESS CAMERA AND VERIFICATION SCRIPT
        let videoStream = null;
        let finalImageData = null;

        async function startLivenessScan() {
            document.getElementById('start-scan-btn').style.display = 'none';
            document.getElementById('scanner-container').style.display = 'flex';
            document.getElementById('final-photo').style.display = 'none';
            document.getElementById('retake-btn').style.display = 'none';
            document.getElementById('video-feed').style.display = 'block';
            document.getElementById('scan-ring').style.display = 'block';
            
            const instructions = document.getElementById('scanner-instructions');
            const video = document.getElementById('video-feed');

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = videoStream;

                instructions.innerText = "Look straight ahead..."; instructions.style.color = "#ff69b4";
                setTimeout(() => { instructions.innerText = "Nod your head up and down..."; }, 3000);
                setTimeout(() => { instructions.innerText = "Turn slightly left..."; }, 6000);
                setTimeout(() => { instructions.innerText = "Turn slightly right..."; }, 9000);
                setTimeout(() => { 
                    instructions.innerText = "Perfect. Now smile! 📸"; 
                    instructions.style.color = "#10b981";
                    document.getElementById('scan-ring').style.borderColor = "#10b981";
                }, 12000);
                setTimeout(() => { capturePhoto(video); }, 13500);

            } catch (err) {
                alert("Camera access denied. Please enable camera permissions.");
                document.getElementById('start-scan-btn').style.display = 'block';
                document.getElementById('scanner-container').style.display = 'none';
            }
        }

        function capturePhoto(video) {
            const canvas = document.getElementById('canvas-capture');
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            finalImageData = canvas.toDataURL('image/jpeg', 0.5); // Comprss base64
            
            videoStream.getTracks().forEach(track => track.stop());

            document.getElementById('video-feed').style.display = 'none';
            document.getElementById('scan-ring').style.display = 'none';
            document.getElementById('scanner-instructions').innerText = "Identity Verified.";
            
            const finalImage = document.getElementById('final-photo');
            finalImage.src = finalImageData;
            finalImage.style.display = 'block';
            document.getElementById('retake-btn').style.display = 'block';
            document.getElementById('photo-status').style.display = 'block';
        }

        // PUSH PROFILE TO FIREBASE
        function submitProfile() {
            const name = document.getElementById('join-name').value;
            const age = document.getElementById('join-age').value;
            const gender = document.getElementById('join-gender').value;
            const country = document.getElementById('join-country').value;
            const whatsapp = document.getElementById('join-whatsapp').value;

            if(!name || !age || !whatsapp || !finalImageData) {
                alert("Please complete all fields and pass the facial verification.");
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = "Uploading to Cloud Database...";
            btn.disabled = true;

            const newProfileData = {
                name: name,
                age: age,
                gender: gender,
                country: country,
                whatsapp: whatsapp,
                photoBase64: finalImageData,
                timestamp: Date.now(),
                banned: false
            };

            database.ref('profiles').push(newProfileData).then(() => {
                alert("Profile Approved! You are now secured in the global network.");
                localStorage.setItem('hasJoinedGlobalMatch', 'true'); // Unlocks matches
                switchTab('find');
                btn.innerText = "Submit Profile & Join Network";
                btn.disabled = false;
            }).catch(error => {
                alert("Network error: " + error.message);
                btn.disabled = false;
            });
        }

        // FETCH MATCHES FROM FIREBASE
        function attemptSearch() {
            if (!localStorage.getItem('hasJoinedGlobalMatch')) {
                document.getElementById('intercept-modal').style.display = 'flex';
                return;
            }
            
            document.getElementById('results-area').style.display = 'block';
            const matchList = document.getElementById('match-list');
            matchList.innerHTML = "<p style='text-align:center;'>Searching global cloud network...</p>";
            
            const searchGender = document.getElementById('search-gender').value;
            const searchCountry = document.getElementById('search-country').value;

            database.ref('profiles').once('value').then((snapshot) => {
                matchList.innerHTML = "";
                let foundMatch = false;

                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    
                    if(data.gender === searchGender && data.country === searchCountry && data.banned !== true) {
                        foundMatch = true;
                        
                        const card = document.createElement('div');
                        card.className = 'match-card';
                        card.innerHTML = `
                            <img src="${data.photoBase64}" class="match-img" oncontextmenu="return false;" draggable="false">
                            <h4 style="margin:15px 0 5px 0; font-size:18px;">${data.name}, ${data.age}</h4>
                            <p style="color:#f472b6; font-size:13px; margin: 0 0 15px 0; font-weight:500;">📍 Live Match in ${data.country}</p>
                            <button class="btn" style="background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);" onclick="window.location.href='https://selar.co/your-product-link?add_to_cart=1'">Unlock Contact ($7.99)</button>
                        `;
                        matchList.appendChild(card);
                    }
                });

                if(!foundMatch) {
                    matchList.innerHTML = `<p style='text-align:center; color:#94a3b8;'>No exact matches online in ${searchCountry} right now. Try another region!</p>`;
                }
            });
        }
    </script>
</body>
</html>
