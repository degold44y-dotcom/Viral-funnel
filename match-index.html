<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Match Engine</title>
    
    <!-- FIREBASE CLOUD DATABASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; padding: 20px; text-align: center; background: #1e293b; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .tabs { display: flex; justify-content: center; width: 100%; max-width: 400px; margin-top: 20px; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border-bottom: 2px solid transparent; color: #94a3b8; font-weight: bold; }
        .tab.active { border-bottom: 2px solid #38bdf8; color: #38bdf8; }
        .container { width: 90%; max-width: 400px; margin-top: 20px; display: none; }
        .container.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 8px; background: #38bdf8; color: #0f172a; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #0ea5e9; }
        
        /* Liveness Scanner Styles */
        #scanner-container { display: none; flex-direction: column; align-items: center; margin-top: 15px; position: relative; }
        #video-feed { width: 250px; height: 250px; object-fit: cover; border-radius: 50%; border: 4px solid #334155; transform: scaleX(-1); }
        #canvas-capture { display: none; }
        #scanner-instructions { margin-top: 15px; font-weight: bold; color: #38bdf8; font-size: 18px; text-align: center; height: 25px; transition: 0.3s; }
        .scan-overlay { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 250px; height: 250px; border-radius: 50%; border: 4px dashed #38bdf8; animation: spin 4s linear infinite; pointer-events: none; }
        @keyframes spin { 100% { transform: translateX(-50%) rotate(360deg); } }
        
        .match-card { background: #1e293b; border-radius: 12px; padding: 15px; margin-top: 15px; text-align: center; border: 1px solid #334155; }
        .match-img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; filter: blur(15px); pointer-events: none; user-select: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 12px; text-align: center; width: 80%; max-width: 350px; }
        .modal-content h3 { color: #ef4444; margin-top: 0; }
        .modal-btn { background: #38bdf8; color: #0f172a; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Global Match Engine</h2>
    </div>

    <div class="tabs">
        <div class="tab active" id="tab-find" onclick="switchTab('find')">Find a Match</div>
        <div class="tab" id="tab-join" onclick="switchTab('join')">Create Profile</div>
    </div>

    <!-- FIND A MATCH SECTION -->
    <div id="section-find" class="container active">
        <div class="form-group">
            <label>I am looking for a:</label>
            <select id="search-gender">
                <option value="Female">Female</option>
                <option value="Male">Male</option>
            </select>
        </div>
        <div class="form-group">
            <label>Location:</label>
            <select id="search-country" class="country-dropdown"></select>
        </div>
        
        <button class="btn" onclick="attemptSearch()">Scan Live Network</button>
        
        <div id="results-area" style="display: none; margin-top: 20px;">
            <h3 style="text-align: center; color: #10b981;">🟢 Live Matches Found</h3>
            <div id="match-list"></div>
        </div>
    </div>

    <!-- CREATE PROFILE SECTION -->
    <div id="section-join" class="container">
        <div class="form-group">
            <label>First Name</label>
            <input type="text" id="join-name" placeholder="Enter first name">
        </div>
        <div class="form-group">
            <label>Age</label>
            <select id="join-age"><option value="" disabled selected>Age</option></select>
        </div>
        <div class="form-group">
            <label>Gender</label>
            <select id="join-gender">
                <option value="Female">Female</option>
                <option value="Male">Male</option>
            </select>
        </div>
        <div class="form-group">
            <label>Country</label>
            <select id="join-country" class="country-dropdown"></select>
        </div>
        <div class="form-group">
            <label>WhatsApp Number</label>
            <input type="tel" id="join-whatsapp" placeholder="e.g. +1234567890">
        </div>
        
        <!-- LIVENESS SCANNER -->
        <button class="btn" id="start-scan-btn" style="background: #10b981;" onclick="startLivenessScan()">📸 Start Facial Verification</button>
        
        <div id="scanner-container">
            <video id="video-feed" autoplay playsinline></video>
            <div class="scan-overlay" id="scan-ring"></div>
            <p id="scanner-instructions">Position face in the circle...</p>
            <canvas id="canvas-capture" width="400" height="400"></canvas>
            <img id="final-photo" style="display:none; width:250px; height:250px; border-radius:50%; border:4px solid #10b981; object-fit:cover; transform:scaleX(-1);">
            <button class="btn" id="retake-btn" style="display:none; background:#ef4444; margin-top:10px;" onclick="startLivenessScan()">🔄 Retake</button>
        </div>

        <p id="photo-status" style="color:#10b981; font-size:14px; text-align:center; display:none; margin-top:10px;">✅ Identity Verified</p>

        <button class="btn" id="submit-btn" onclick="submitProfile()" style="margin-top:20px;">Submit Profile & Join Network</button>
    </div>

    <!-- INTERCEPT MODAL -->
    <div id="intercept-modal" class="modal">
        <div class="modal-content">
            <h3>Access Denied</h3>
            <p>You must add your live profile to the global network before you can view and unlock other members. It's only fair!</p>
            <button class="modal-btn" onclick="closeModalAndJoin()">Create Profile</button>
        </div>
    </div>

    <script>
        // 1. INITIALIZE FIREBASE (LIVE CLOUD CONNECTION)
        const firebaseConfig = {
            apiKey: "AIzaSyAMuWAC8kNbGPdmlkngHUA7yG_f0vB_l4U",
            authDomain: "global-match-99b4e.firebaseapp.com",
            databaseURL: "https://global-match-99b4e-default-rtdb.firebaseio.com",
            projectId: "global-match-99b4e",
            storageBucket: "global-match-99b4e.firebasestorage.app",
            messagingSenderId: "816808980244",
            appId: "1:816808980244:web:832c3852ead2b707bb9c01"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. POPULATE DROPDOWNS
        const allCountries = ["United States", "United Kingdom", "Canada", "Australia", "Nigeria", "South Africa", "Ghana", "Kenya", "Germany"]; 
        const countryDropdowns = document.querySelectorAll('.country-dropdown');
        countryDropdowns.forEach(dropdown => {
            allCountries.forEach(country => {
                let option = document.createElement('option'); option.value = country; option.innerText = country;
                dropdown.appendChild(option);
            });
        });

        const ageDropdown = document.getElementById('join-age');
        for(let i = 18; i <= 75; i++) {
            let option = document.createElement('option'); option.value = i; option.innerText = i;
            ageDropdown.appendChild(option);
        }

        // 3. UI LOGIC
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`section-${tab}`).classList.add('active');
        }

        function closeModalAndJoin() {
            document.getElementById('intercept-modal').style.display = 'none';
            switchTab('join');
        }

        // 4. LIVENESS CAMERA SCRIPT
        let videoStream = null;
        let finalImageData = null;

        async function startLivenessScan() {
            document.getElementById('start-scan-btn').style.display = 'none';
            document.getElementById('scanner-container').style.display = 'flex';
            document.getElementById('final-photo').style.display = 'none';
            document.getElementById('retake-btn').style.display = 'none';
            document.getElementById('video-feed').style.display = 'block';
            document.getElementById('scan-ring').style.display = 'block';
            
            const instructions = document.getElementById('scanner-instructions');
            const video = document.getElementById('video-feed');

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = videoStream;

                instructions.innerText = "Look straight ahead..."; instructions.style.color = "#38bdf8";
                setTimeout(() => { instructions.innerText = "Nod your head up and down..."; }, 3000);
                setTimeout(() => { instructions.innerText = "Turn slightly left..."; }, 6000);
                setTimeout(() => { instructions.innerText = "Turn slightly right..."; }, 9000);
                setTimeout(() => { 
                    instructions.innerText = "Perfect. Now smile! 📸"; 
                    instructions.style.color = "#10b981";
                    document.getElementById('scan-ring').style.borderColor = "#10b981";
                }, 12000);
                setTimeout(() => { capturePhoto(video); }, 13500);

            } catch (err) {
                alert("Camera access denied. Please enable camera permissions.");
                document.getElementById('start-scan-btn').style.display = 'block';
                document.getElementById('scanner-container').style.display = 'none';
            }
        }

        function capturePhoto(video) {
            const canvas = document.getElementById('canvas-capture');
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            finalImageData = canvas.toDataURL('image/jpeg', 0.5); // Compressed for database
            
            videoStream.getTracks().forEach(track => track.stop());

            document.getElementById('video-feed').style.display = 'none';
            document.getElementById('scan-ring').style.display = 'none';
            document.getElementById('scanner-instructions').innerText = "Identity Verified.";
            
            const finalImage = document.getElementById('final-photo');
            finalImage.src = finalImageData;
            finalImage.style.display = 'block';
            document.getElementById('retake-btn').style.display = 'block';
            document.getElementById('photo-status').style.display = 'block';
        }

        // 5. PUSH PROFILE TO FIREBASE
        function submitProfile() {
            const name = document.getElementById('join-name').value;
            const age = document.getElementById('join-age').value;
            const gender = document.getElementById('join-gender').value;
            const country = document.getElementById('join-country').value;
            const whatsapp = document.getElementById('join-whatsapp').value;

            if(!name || !age || !whatsapp || !finalImageData) {
                alert("Please complete all fields and pass the facial verification.");
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.innerText = "Uploading to Cloud Database...";
            btn.disabled = true;

            const newProfileData = {
                name: name,
                age: age,
                gender: gender,
                country: country,
                whatsapp: whatsapp,
                photoBase64: finalImageData,
                timestamp: Date.now(),
                banned: false
            };

            // Push to Firebase Realtime Database
            database.ref('profiles').push(newProfileData).then(() => {
                alert("Profile Approved! You are now secured in the global network.");
                localStorage.setItem('hasJoinedGlobalMatch', 'true'); // Unlock search
                switchTab('find');
                btn.innerText = "Submit Profile & Join Network";
                btn.disabled = false;
            }).catch(error => {
                alert("Network error: " + error.message);
                btn.disabled = false;
            });
        }

        // 6. FETCH MATCHES FROM FIREBASE
        function attemptSearch() {
            if (!localStorage.getItem('hasJoinedGlobalMatch')) {
                document.getElementById('intercept-modal').style.display = 'flex';
                return;
            }
            
            document.getElementById('results-area').style.display = 'block';
            const matchList = document.getElementById('match-list');
            matchList.innerHTML = "<p style='text-align:center;'>Searching global cloud network...</p>";
            
            const searchGender = document.getElementById('search-gender').value;
            const searchCountry = document.getElementById('search-country').value;

            database.ref('profiles').once('value').then((snapshot) => {
                matchList.innerHTML = "";
                let foundMatch = false;

                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    
                    // Filter logic & Ignore banned users
                    if(data.gender === searchGender && data.country === searchCountry && data.banned !== true) {
                        foundMatch = true;
                        
                        const card = document.createElement('div');
                        card.className = 'match-card';
                        card.innerHTML = `
                            <img src="${data.photoBase64}" class="match-img" oncontextmenu="return false;" draggable="false">
                            <h4>${data.name}, ${data.age}</h4>
                            <p style="color:#94a3b8; font-size:12px;">📍 ${data.country}</p>
                            <p>Status: Online 🟢</p>
                            <button class="btn" style="background:#f59e0b;" onclick="window.location.href='https://selar.co/your-product-link?add_to_cart=1'">Unlock WhatsApp ($7.99)</button>
                        `;
                        matchList.appendChild(card);
                    }
                });

                if(!foundMatch) {
                    matchList.innerHTML = `<p style='text-align:center; color:#94a3b8;'>No exact matches online in ${searchCountry} right now. Try expanding your search!</p>`;
                }
            });
        }
    </script>
</body>
</html>
