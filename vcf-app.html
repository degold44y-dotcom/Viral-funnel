<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Cache-busting meta tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Global VCF Generator Engine</title>
    
    <!-- FIREBASE CLOUD DATABASE -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0c0b1a; 
            color: #f8fafc; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }
        
        .header { width: 100%; padding: 24px; text-align: center; background: rgba(30, 27, 56, 0.45); border-bottom: 1px solid rgba(59, 130, 246, 0.3); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4); }
        .header h2 { margin: 0; font-size: 26px; font-weight: 800; color: #3b82f6; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: #94a3b8; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }

        .container { width: 90%; max-width: 450px; margin-top: 40px; background: #1a162e; padding: 30px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px rgba(0,0,0,0.5); box-sizing: border-box; margin-bottom: 40px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #cbd5e1; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12); background: #0c0b1a; color: white; box-sizing: border-box; font-size: 16px; font-weight: bold; transition: all 0.3s ease; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 8px rgba(59, 130, 246, 0.3); }
        
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; background: #3b82f6; color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); }
        
        .info-box { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 12px; padding: 15px; margin: 20px 0; text-align: center; }
        .info-box h4 { color: #3b82f6; margin: 0 0 8px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .info-box p { color: #cbd5e1; font-size: 12px; margin: 0; line-height: 1.5; }
        
        .quantity-display { background: #0c0b1a; border: 1px dashed #10b981; color: #10b981; padding: 15px; border-radius: 10px; text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 20px; }

        /* MODAL STYLES */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 10, 20, 0.95); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-content { background: #1a162e; padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 380px; border: 1px solid #3b82f6; box-shadow: 0 0 30px rgba(59,130,246,0.2); }
        .modal-content h3 { color: #3b82f6; margin-top: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .modal-btn { background: transparent; border: 1px solid #3b82f6; color: #3b82f6; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; transition: 0.3s; text-transform: uppercase; }
        .modal-btn:hover { background: rgba(59,130,246,0.1); }
    </style>
</head>
<body>

    <div class="header">
        <h2>⚡ VCF Engine PRO</h2>
        <p>Bulk Contact Generator</p>
    </div>

    <div class="container">
        
        <div class="info-box">
            <h4>📈 Boost Your Status Views</h4>
            <p>Generate thousands of active WhatsApp numbers instantly. Save the VCF file to your phone, and watch your business engagement explode.</p>
        </div>
        
        <!-- DYNAMIC QUANTITY SET BY ADMIN -->
        <div class="quantity-display" id="display-quantity">
            Loading capacity...
        </div>
        
        <div class="form-group">
            <label>Your Currency/Location</label>
            <select id="buyer-country" class="country-dropdown"></select>
        </div>

        <div class="form-group">
            <label>Target Country Prefix</label>
            <input type="text" id="vcf-prefix" placeholder="e.g., +23480 or +1202" value="+234">
        </div>

        <div class="form-group">
            <label>Contact Naming Format</label>
            <input type="text" id="vcf-name" placeholder="e.g., ActiveBuyer" value="VIP_Buyer_">
        </div>

        <button class="btn" onclick="openPaymentModal()">Generate & Download VCF</button>
    </div>

    <!-- VIP ACCESS KEY MODAL -->
    <div id="unlock-modal" class="modal">
        <div class="modal-content">
            <h3>VIP Access Required</h3>
            <p style="margin-bottom: 20px; font-size: 13px; color: #cbd5e1;" id="modal-pricing-text">Loading price...</p>
            
            <input type="text" id="access-key-input" placeholder="ENTER ACCESS KEY" style="margin-bottom: 15px; text-align: center; text-transform: uppercase; font-weight: bold; letter-spacing: 2px;">
            
            <button class="btn" id="verify-key-btn" onclick="verifyAndDownload()" style="margin-top: 0; background: #10b981; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">🔓 Verify & Download</button>
            <button class="modal-btn" id="buy-key-modal-btn" onclick="openPaymentPortal()">Buy VCF Access Key</button>
            
            <p style="margin-top: 20px; cursor: pointer; color: #94a3b8; font-size: 12px; font-weight: bold;" onclick="document.getElementById('unlock-modal').style.display='none'">CANCEL</p>
        </div>
    </div>

    <script>
        // FIREBASE INITIALIZATION
        const firebaseConfig = {
            apiKey: "AIzaSyAMuWAC8kNbGPdmlkngHUA7yG_f0vB_l4U",
            authDomain: "global-match-99b4e.firebaseapp.com",
            databaseURL: "https://global-match-99b4e-default-rtdb.firebaseio.com",
            projectId: "global-match-99b4e",
            storageBucket: "global-match-99b4e.firebasestorage.app",
            messagingSenderId: "816808980244",
            appId: "1:816808980244:web:832c3852ead2b707bb9c01"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let liveExchangeRates = {};
        let vcfAdminSettings = { 
            globalQuantity: 10000, 
            basePriceUSD: 5.00, 
            paymentLink: "", 
            tierUS: 9.99, tierUK: 7.99, tierCA: 12.99, tierAU: 14.99, tierDE: 8.99 
        };

        // FETCH SETTINGS AND RATES
        async function fetchAppSettings() {
            try {
                const snap = await database.ref('vcf_admin_settings').once('value');
                if (snap.val()) {
                    vcfAdminSettings = { ...vcfAdminSettings, ...snap.val() };
                    document.getElementById('display-quantity').innerText = `🔥 Generates ${vcfAdminSettings.globalQuantity.toLocaleString()} Contacts per File`;
                }
            } catch (err) { console.warn("Using default settings"); }
        }

        async function fetchExchangeRates() {
            try {
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await response.json();
                liveExchangeRates = data.rates;
            } catch (err) { console.warn("Could not fetch rates"); }
        }

        function calculateLocalizedPrice(targetCountry) {
            const baseUSD = vcfAdminSettings.basePriceUSD || 5.00;
            const tieredPrices = {
                "United States": { price: vcfAdminSettings.tierUS || 9.99, currency: "USD", symbol: "$" },
                "United Kingdom": { price: vcfAdminSettings.tierUK || 7.99, currency: "GBP", symbol: "£" },
                "Canada": { price: vcfAdminSettings.tierCA || 12.99, currency: "CAD", symbol: "CA$" },
                "Australia": { price: vcfAdminSettings.tierAU || 14.99, currency: "AUD", symbol: "AU$" },
                "Germany": { price: vcfAdminSettings.tierDE || 8.99, currency: "EUR", symbol: "€" }
            };

            if (tieredPrices[targetCountry]) return `${tieredPrices[targetCountry].symbol}${tieredPrices[targetCountry].price.toFixed(2)} ${tieredPrices[targetCountry].currency}`;

            let convertedRate = liveExchangeRates['NGN'] || 1500;
            let currencySymbol = "₦"; let currencyCode = "NGN";

            if (targetCountry === "South Africa") { convertedRate = liveExchangeRates['ZAR'] || 18; currencySymbol = "R"; currencyCode = "ZAR"; } 
            else if (targetCountry === "Ghana") { convertedRate = liveExchangeRates['GHS'] || 13.5; currencySymbol = "GH₵"; currencyCode = "GHS"; }
            else if (targetCountry === "India") { convertedRate = liveExchangeRates['INR'] || 83; currencySymbol = "₹"; currencyCode = "INR"; } 
            else if (targetCountry === "France" || targetCountry === "Italy" || targetCountry === "Spain") { convertedRate = liveExchangeRates['EUR'] || 0.92; currencySymbol = "€"; currencyCode = "EUR"; } 
            else if (targetCountry === "Brazil") { convertedRate = liveExchangeRates['BRL'] || 5.5; currencySymbol = "R$"; currencyCode = "BRL"; } 
            else if (targetCountry === "Mexico") { convertedRate = liveExchangeRates['MXN'] || 18; currencySymbol = "$"; currencyCode = "MXN"; }

            const finalPrice = baseUSD * convertedRate;
            return `${currencySymbol}${Math.ceil(finalPrice).toLocaleString()} ${currencyCode}`;
        }

        // POPULATE DROPDOWNS
        const topTierCountries = [ "United States", "United Kingdom", "Canada", "Australia", "Germany" ];
        const otherCountries = [ "Nigeria", "Ghana", "South Africa", "India", "France", "Italy", "Spain", "Brazil", "Mexico" ];

        const countryDropdowns = document.querySelectorAll('.country-dropdown');
        countryDropdowns.forEach(dropdown => {
            topTierCountries.forEach((country) => {
                let option = document.createElement('option'); option.value = country; option.innerText = country;
                if (country === "United States") option.selected = true;
                dropdown.appendChild(option);
            });
            let separator = document.createElement('option'); separator.disabled = true; separator.innerText = "──────────"; dropdown.appendChild(separator);
            otherCountries.forEach(country => {
                let option = document.createElement('option'); option.value = country; option.innerText = country;
                dropdown.appendChild(option);
            });
        });

        window.onload = async () => { 
            await fetchAppSettings();
            await fetchExchangeRates();
        };

        // ==========================================
        // UI & PAYMENT MODAL
        // ==========================================
        function openPaymentModal() {
            const prefix = document.getElementById('vcf-prefix').value.trim();
            if (!prefix) {
                alert("Please enter a Target Country Prefix first.");
                return;
            }
            
            const buyerCountry = document.getElementById('buyer-country').value;
            const displayPrice = calculateLocalizedPrice(buyerCountry);
            
            document.getElementById('modal-pricing-text').innerText = `Cost: ${displayPrice} (Generates ${vcfAdminSettings.globalQuantity.toLocaleString()} Contacts)`;
            document.getElementById('buy-key-modal-btn').innerText = `Buy Access Key (${displayPrice})`;
            
            document.getElementById('access-key-input').value = "";
            document.getElementById('unlock-modal').style.display = 'flex';
        }

        function openPaymentPortal() {
            const link = vcfAdminSettings.paymentLink || 'https://selar.co/';
            window.open(link, '_blank');
        }

        // ==========================================
        // KEY VERIFICATION & DATABASE CHECK
        // ==========================================
        function verifyAndDownload() {
            const keyInput = document.getElementById('access-key-input').value.trim().toUpperCase();
            const btn = document.getElementById('verify-key-btn');

            if (!keyInput) { alert("Please enter a valid Access Key."); return; }

            if (keyInput === "GOLD-BOSS-LIFETIME") {
                document.getElementById('unlock-modal').style.display = 'none';
                generateVCFFile();
                return;
            }

            btn.innerText = "Verifying..."; 
            btn.disabled = true;

            database.ref('vcf_access_keys/' + keyInput).once('value').then((snapshot) => {
                const keyData = snapshot.val();
                
                if (keyData && keyData.used === false) {
                    database.ref('vcf_access_keys/' + keyInput).update({ used: true, usedAt: Date.now() }).then(() => {
                        document.getElementById('unlock-modal').style.display = 'none';
                        generateVCFFile(); 
                        btn.innerText = "🔓 Verify & Download"; 
                        btn.disabled = false;
                    });
                } else {
                    alert("❌ Error: Invalid or Already Used Key.");
                    btn.innerText = "🔓 Verify & Download"; 
                    btn.disabled = false;
                }
            }).catch((error) => {
                alert("Network Error: " + error.message);
                btn.innerText = "🔓 Verify & Download"; 
                btn.disabled = false;
            });
        }

        // ==========================================
        // THE VCF GENERATOR ENGINE
        // ==========================================
        function generateVCFFile() {
            const prefix = document.getElementById('vcf-prefix').value.trim();
            const qty = vcfAdminSettings.globalQuantity || 10000; 
            const baseName = document.getElementById('vcf-name').value.trim() || "VIP_Buyer_";
            
            let vcfData = "";
            
            for (let i = 1; i <= qty; i++) {
                const randomNum = Math.floor(1000000 + Math.random() * 9000000);
                const fullNumber = `${prefix}${randomNum}`;
                vcfData += `BEGIN:VCARD\nVERSION:3.0\nFN:${baseName}${i}\nTEL;TYPE=CELL:${fullNumber}\nEND:VCARD\n`;
            }

            const blob = new Blob([vcfData], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `VIP_${qty}_Contacts.vcf`;
            
            document.body.appendChild(a);
            a.click();
            
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
            
            alert(`✅ Success! ${qty.toLocaleString()} contacts have been generated and downloaded to your device.`);
        }
    </script>
</body>
</html>
