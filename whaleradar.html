<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolySniper | Live Whale Radar</title>
    <style>
        :root {
            --bg-base: #06090e;
            --bg-panel: #11151c;
            --border-dark: #1f2937;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --green-glow: #00ff66;
            --red-glow: #ff3366;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'SF Pro Display', system-ui, sans-serif; }
        
        /* Desktop Base */
        body { background-color: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border-dark); }
        .logo { font-size: 18px; font-weight: 900; letter-spacing: 1px; color: white; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        .logo span { color: var(--green-glow); }
        
        .timeframes { background: rgba(0, 255, 102, 0.1); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--green-glow); color: var(--green-glow); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
        .pulse-dot { width: 6px; height: 6px; background-color: var(--green-glow); border-radius: 50%; box-shadow: 0 0 8px var(--green-glow); animation: pulse 1.5s infinite; }

        .status-badge { background: var(--border-dark); color: white; border: none; padding: 10px 15px; font-weight: 800; font-size: 12px; border-radius: 6px; text-transform: uppercase; }

        /* SPLIT DASHBOARD */
        .dashboard { display: flex; flex: 1; overflow: hidden; }
        .column { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border-dark); }
        .column:last-child { border-right: none; }
        
        .col-header { padding: 15px 20px; background: var(--bg-base); border-bottom: 1px solid var(--border-dark); position: sticky; top: 0; z-index: 10; }
        .col-header h2 { font-size: 13px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; display: flex; justify-content: space-between; align-items: center; }

        .feed { flex: 1; overflow-y: auto; padding: 15px 20px; }

        /* SIGNAL CARDS */
        .signal-card { background: var(--bg-panel); border: 1px solid var(--border-dark); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        
        .market-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; color: white; }
        .market-meta { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .tag { font-size: 10px; padding: 3px 6px; background: var(--border-dark); border-radius: 4px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        
        .odds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .odd-box { padding: 12px; border-radius: 8px; border: 1px solid var(--border-dark); text-align: center; }
        .odd-box.trigger-up { background: rgba(0, 255, 102, 0.1); border-color: var(--green-glow); color: var(--green-glow); }
        .odd-box.trigger-down { background: rgba(255, 51, 102, 0.1); border-color: var(--red-glow); color: var(--red-glow); }
        
        .outcome-name { font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .outcome-price { font-size: 20px; font-weight: 900; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 4px; }

        /* MOBILE RESPONSIVE FIX */
        @media (max-width: 768px) {
            body { height: auto; overflow-y: auto; display: block; }
            .header { flex-direction: column; align-items: stretch; gap: 12px; padding: 15px; }
            .logo { justify-content: center; margin-bottom: 5px; }
            .timeframes { justify-content: center; }
            .status-badge { text-align: center; }
            
            .dashboard { flex-direction: column; display: block; overflow: visible; }
            .column { border-right: none; border-bottom: 4px solid #000; display: block; overflow: visible; }
            
            .col-header { position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-dark); }
            .feed { overflow-y: visible; padding: 15px; }
            
            .odds-grid { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><span>⚡</span> WHALERADAR <span>|</span> <span style="font-size: 11px; color: var(--text-muted);">LIVE TESTER</span></div>
        <div class="timeframes">
            <div class="pulse-dot"></div> 1H & 1D TARGETS
        </div>
        <div class="status-badge">SCANNER: UNRESTRICTED</div>
    </div>

    <div class="dashboard">
        <!-- CRYPTO COLUMN -->
        <div class="column" id="crypto-col">
            <div class="col-header">
                <h2>Crypto Pulse <div class="pulse-dot"></div></h2>
            </div>
            <div class="feed" id="crypto-feed"></div>
        </div>

        <!-- SPORTS COLUMN -->
        <div class="column" id="sports-col">
            <div class="col-header">
                <h2>Daily Sports <div class="pulse-dot"></div></h2>
            </div>
            <div class="feed" id="sports-feed"></div>
        </div>
    </div>

    <script>
        const TRIGGER_THRESHOLD = 0.70; // 70% Whale Conviction Trigger

        async function fetchMarkets() {
            const cryptoFeed = document.getElementById('crypto-feed');
            const sportsFeed = document.getElementById('sports-feed');
            
            if(cryptoFeed.innerHTML === '') {
                cryptoFeed.innerHTML = '<div style="text-align:center; padding: 40px 0; color: var(--text-muted); font-size: 13px;">Scanning Markets...</div>';
                sportsFeed.innerHTML = '<div style="text-align:center; padding: 40px 0; color: var(--text-muted); font-size: 13px;">Scanning Daily Sports...</div>';
            }

            try {
                // Fetching 500 markets to ensure broad daily coverage
                const response = await fetch('https://gamma-api.polymarket.com/markets?active=true&closed=false&limit=500');
                const data = await response.json();

                let cryptoHtml = '';
                let sportsHtml = '';

                data.forEach(market => {
                    let outcomes = [];
                    let prices = [];
                    
                    try {
                        outcomes = typeof market.outcomes === 'string' ? JSON.parse(market.outcomes) : (market.outcomes || []);
                        let rawPrices = typeof market.outcomePrices === 'string' ? JSON.parse(market.outcomePrices) : (market.outcomePrices || []);
                        prices = rawPrices.map(p => parseFloat(p));
                    } catch(e) { return; }
                    
                    if (outcomes.length < 2 || prices.length < 2) return;

                    // Trigger Check
                    let hasSignal = prices.some(p => p >= TRIGGER_THRESHOLD);
                    if (!hasSignal) return; 

                    let oddBoxes = '';
                    outcomes.forEach((outcome, index) => {
                        let price = prices[index];
                        let percent = Math.round(price * 100);
                        
                        let boxClass = 'odd-box';
                        let signalIcon = '';
                        if (price >= TRIGGER_THRESHOLD) {
                            boxClass += (outcome.toLowerCase() === 'no') ? ' trigger-down' : ' trigger-up';
                            signalIcon = (outcome.toLowerCase() === 'no') ? '🔴 DOWN ' : '🟢 UP ';
                        }

                        oddBoxes += `
                            <div class="${boxClass}">
                                <div class="outcome-name">${signalIcon} ${outcome}</div>
                                <div class="outcome-price">${percent}%</div>
                            </div>
                        `;
                    });

                    // Build Unlocked Card Structure
                    let cardHtml = `
                        <div class="signal-card">
                            <div class="market-meta">
                                <span class="tag">$${(market.volume || 0).toLocaleString(undefined, {maximumFractionDigits: 0})} Vol</span>
                            </div>
                            <div class="market-title">${market.question}</div>
                            <div class="odds-grid">${oddBoxes}</div>
                        </div>
                    `;

                    // Route to correct column
                    let category = (market.category || "").toLowerCase();
                    let question = (market.question || "").toLowerCase();
                    
                    let isCrypto = category.includes("crypto") || category.includes("bitcoin") || category.includes("eth") || question.includes("btc") || question.includes("eth");
                    let isSports = category.includes("sports") || category.includes("nfl") || category.includes("mlb") || category.includes("nba") || category.includes("soccer") || category.includes("tennis") || category.includes("nhl") || category.includes("ufc") || category.includes("esports") || question.includes(" vs ");

                    if (isCrypto) {
                        cryptoHtml += cardHtml;
                    } else if (isSports) {
                        sportsHtml += cardHtml;
                    }
                });

                cryptoFeed.innerHTML = cryptoHtml || '<div style="color: var(--text-muted); text-align: center; margin-top:30px; font-size: 13px;">No Crypto signals >= 70% right now.</div>';
                sportsFeed.innerHTML = sportsHtml || '<div style="color: var(--text-muted); text-align: center; margin-top:30px; font-size: 13px;">No Sports signals >= 70% right now.</div>';

            } catch (error) {
                console.error("API Error:", error);
            }
        }

        // Init and refresh every 20 seconds
        fetchMarkets();
        setInterval(fetchMarkets, 20000);
    </script>
</body>
</html>
