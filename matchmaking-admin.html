<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchmaking Admin - Control Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .container { width: 100%; max-width: 800px; margin-top: 20px; background: #1e293b; padding: 20px; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { color: #38bdf8; }
        .ban-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .ban-btn:hover { background: #dc2626; }
        .stats-grid { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: #0f172a; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
        .stat-card h3 { margin: 0; color: #38bdf8; font-size: 24px; }
        .stat-card p { margin: 5px 0 0 0; color: #94a3b8; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🛡️ Matchmaking Admin</h2>
        <button class="ban-btn" onclick="location.href='index.html'">Back to App</button>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="total-users">0</h3>
                <p>Total Profiles Registered</p>
            </div>
            <div class="stat-card">
                <h3 id="banned-count">0</h3>
                <p>Active Bans / Blacklisted</p>
            </div>
        </div>

        <h3>Registered Database Profiles</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Country</th>
                    <th>Age / Gender</th>
                    <th>WhatsApp</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="admin-user-list">
                <tr>
                    <td colspan="5" style="text-align: center; color: #94a3b8;">Loading database records...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function loadAdminData() {
            const mockProfiles = [
                { id: 1, name: "Jessica M.", country: "United States", age: 23, gender: "Female", whatsapp: "+15550192" },
                { id: 2, name: "Chloe T.", country: "United Kingdom", age: 25, gender: "Female", whatsapp: "+44791112" }
            ];

            document.getElementById('total-users').innerText = mockProfiles.length;
            document.getElementById('banned-count').innerText = 0;

            const tbody = document.getElementById('admin-user-list');
            tbody.innerHTML = "";

            mockProfiles.forEach(user => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.name}</td>
                    <td>${user.country}</td>
                    <td>${user.age} / ${user.gender}</td>
                    <td>${user.whatsapp}</td>
                    <td><button class="ban-btn" onclick="banUser('${user.whatsapp}')">Ban & Blacklist</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function banUser(whatsapp) {
            if(confirm(`Are you sure you want to permanently blacklist ${whatsapp}?`)) {
                alert(`User ${whatsapp} has been banned and added to the Firebase Blacklist.`);
                loadAdminData();
            }
        }

        loadAdminData();
    </script>
</body>
</html>
