<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchmaking Admin - Live Control Panel</title>
    
    <!-- FIREBASE CLOUD DATABASE SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .container { width: 100%; max-width: 800px; margin-top: 20px; background: #1e293b; padding: 20px; border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 600px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { color: #38bdf8; }
        .ban-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .ban-btn:hover { background: #dc2626; }
        .unban-btn { background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .stats-grid { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: #0f172a; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
        .stat-card h3 { margin: 0; color: #38bdf8; font-size: 24px; }
        .stat-card p { margin: 5px 0 0 0; color: #94a3b8; font-size: 12px; }
        .photo-thumb { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🛡️ Live Database Admin</h2>
        <button class="ban-btn" style="background: #38bdf8; color: #0f172a;" onclick="location.href='match-index.html'">View Main App</button>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="total-users">0</h3>
                <p>Total Profiles Registered</p>
            </div>
            <div class="stat-card">
                <h3 id="banned-count">0</h3>
                <p>Active Bans / Hidden</p>
            </div>
        </div>

        <h3>Live Network Profiles</h3>
        <table>
            <thead>
                <tr>
                    <th>Selfie</th>
                    <th>Name (Age/Sex)</th>
                    <th>Location</th>
                    <th>WhatsApp</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="admin-user-list">
                <tr>
                    <td colspan="6" style="text-align: center; color: #94a3b8;">Connecting to Firebase Cloud...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // 1. INITIALIZE FIREBASE (SAME KEYS AS YOUR APP)
        const firebaseConfig = {
            apiKey: "AIzaSyAMuWAC8kNbGPdmlkngHUA7yG_f0vB_l4U",
            authDomain: "global-match-99b4e.firebaseapp.com",
            databaseURL: "https://global-match-99b4e-default-rtdb.firebaseio.com",
            projectId: "global-match-99b4e",
            storageBucket: "global-match-99b4e.firebasestorage.app",
            messagingSenderId: "816808980244",
            appId: "1:816808980244:web:832c3852ead2b707bb9c01"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. LISTEN FOR LIVE DATABASE UPDATES
        database.ref('profiles').on('value', (snapshot) => {
            const tbody = document.getElementById('admin-user-list');
            tbody.innerHTML = "";
            
            let totalUsers = 0;
            let bannedUsers = 0;

            if (!snapshot.exists()) {
                tbody.innerHTML = "<tr><td colspan='6' style='text-align: center; color: #94a3b8;'>Database is empty. Waiting for users to register...</td></tr>";
                document.getElementById('total-users').innerText = 0;
                document.getElementById('banned-count').innerText = 0;
                return;
            }

            snapshot.forEach((childSnapshot) => {
                const key = childSnapshot.key; // Unique Firebase ID for the user
                const data = childSnapshot.val();
                
                totalUsers++;
                if (data.banned) bannedUsers++;

                let tr = document.createElement('tr');
                
                // Determine Status and which button to show (Ban vs Unban)
                let statusText = data.banned ? "<span style='color:#ef4444; font-weight:bold;'>Banned</span>" : "<span style='color:#10b981;'>Active</span>";
                let actionBtn = data.banned 
                    ? `<button class="unban-btn" onclick="toggleBan('${key}', false)">Unban</button>`
                    : `<button class="ban-btn" onclick="toggleBan('${key}', true)">Ban</button>`;

                tr.innerHTML = `
                    <td><img src="${data.photoBase64}" class="photo-thumb"></td>
                    <td><strong>${data.name}</strong><br><span style="font-size:12px; color:#94a3b8;">${data.age} / ${data.gender}</span></td>
                    <td>${data.country}</td>
                    <td>${data.whatsapp}</td>
                    <td>${statusText}</td>
                    <td>
                        ${actionBtn} 
                        <button class="ban-btn" style="background:#64748b;" onclick="deleteProfile('${key}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-users').innerText = totalUsers;
            document.getElementById('banned-count').innerText = bannedUsers;
        });

        // 3. BAN CONTROL (Hides user from public app search without deleting them)
        function toggleBan(userId, banStatus) {
            if (banStatus) {
                if(!confirm("Are you sure you want to ban this user? They will disappear from the public matchmaking search.")) return;
            }
            database.ref('profiles/' + userId).update({ banned: banStatus });
        }

        // 4. DELETE CONTROL (Permanently erases data)
        function deleteProfile(userId) {
            if(confirm("PERMANENT DELETE: Are you sure you want to completely erase this profile from the cloud database?")) {
                database.ref('profiles/' + userId).remove();
            }
        }
    </script>
</body>
</html>
