<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Engine - ADMIN</title>
    
    <!-- FIREBASE CLOUD DATABASE -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0c0b1a; color: #f8fafc; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid #ff1493; padding-bottom: 15px; }
        h1 { margin: 0; color: #ff1493; text-transform: uppercase; font-size: 24px; letter-spacing: 2px; }
        
        .admin-nav { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .nav-btn { background: #1a162e; border: 1px solid #ff69b4; color: white; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .nav-btn.active { background: linear-gradient(135deg, #ff1493, #8a2be2); }

        .section { display: none; }
        .section.active { display: block; }

        /* Bulk Key Generator Section */
        .key-generator { background: #1a162e; padding: 25px; border-radius: 12px; max-width: 500px; margin: 0 auto; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0c0b1a; color: white; box-sizing: border-box; font-size: 16px; }
        
        .generate-btn { background: #10b981; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .key-display { background: #0c0b1a; padding: 15px; font-family: monospace; font-size: 14px; color: #f9d423; border: 1px dashed #f9d423; margin-top: 15px; max-height: 150px; overflow-y: auto; text-align: left; white-space: pre-wrap; word-break: break-all; }
        
        .key-list-container { margin-top: 30px; max-width: 600px; margin: 30px auto; }
        .key-item { display: flex; justify-content: space-between; background: #1a162e; padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #10b981; align-items: center;}
        .key-item.used { border-left-color: #ef4444; opacity: 0.6; }
        .copy-btn { background: #3b82f6; border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        /* Profiles Manager Section */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: #1a162e; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .card h3 { margin: 0 0 5px 0; color: #ff1493; }
        .card p { margin: 5px 0; font-size: 13px; color: #cbd5e1; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>👑 Admin Dashboard</h1>
        <p style="color: #94a3b8; font-size: 14px;">Global Match Engine Security Panel</p>
    </div>

    <div class="admin-nav">
        <button class="nav-btn active" id="btn-keys" onclick="switchTab('keys')">🔑 Bulk Generate Keys</button>
        <button class="nav-btn" id="btn-profiles" onclick="switchTab('profiles')">👥 Manage Profiles</button>
    </div>

    <!-- KEY GENERATOR SECTION -->
    <div id="section-keys" class="section active">
        <div class="key-generator">
            <h2 style="margin-top: 0;">Bulk Key Generator</h2>
            <p style="font-size: 13px; color: #94a3b8;">Generate multiple single-use keys at once for your custom payment platform.</p>
            
            <div class="input-group">
                <label>Quantity to Generate</label>
                <input type="number" id="key-quantity" value="10" min="1" max="100">
            </div>

            <button class="generate-btn" onclick="generateBulkKeys()">⚡ GENERATE BATCH KEYS</button>
            
            <div id="new-key-box" style="display: none;">
                <div class="key-display" id="latest-keys-text"></div>
                <button class="copy-btn" style="width: 100%; padding: 12px; font-size: 16px; margin-top: 10px;" onclick="copyAllGeneratedKeys()">📋 Copy All Generated Keys</button>
            </div>
        </div>

        <div class="key-list-container">
            <h3 style="border-bottom: 1px solid #333; padding-bottom: 10px;">Recent Keys Database</h3>
            <div id="keys-list">Loading keys...</div>
        </div>
    </div>

    <!-- PROFILES MANAGER SECTION -->
    <div id="section-profiles" class="section">
        <h3 style="text-align: center; margin-bottom: 20px;">Live Global Profiles</h3>
        <div class="grid" id="profiles-grid">Loading profiles...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAMuWAC8kNbGPdmlkngHUA7yG_f0vB_l4U",
            authDomain: "global-match-99b4e.firebaseapp.com",
            databaseURL: "https://global-match-99b4e-default-rtdb.firebaseio.com",
            projectId: "global-match-99b4e",
            storageBucket: "global-match-99b4e.firebasestorage.app",
            messagingSenderId: "816808980244",
            appId: "1:816808980244:web:832c3852ead2b707bb9c01"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function switchTab(tab) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(`btn-${tab}`).classList.add('active');
            document.getElementById(`section-${tab}`).classList.add('active');
            
            if (tab === 'profiles') loadProfiles();
            if (tab === 'keys') loadKeys();
        }

        function generateRandomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function generateBulkKeys() {
            const qty = parseInt(document.getElementById('key-quantity').value) || 1;
            const updates = {};
            let generatedList = [];

            for (let i = 0; i < qty; i++) {
                const newKey = `MATCH-${generateRandomString(4)}-${generateRandomString(4)}`;
                updates['access_keys/' + newKey] = {
                    used: false,
                    createdAt: Date.now() + i // Offset timestamp to keep unique order
                };
                generatedList.push(newKey);
            }

            const btn = document.querySelector('.generate-btn');
            btn.innerText = "Saving to Cloud...";
            btn.disabled = true;

            database.ref().update(updates).then(() => {
                document.getElementById('new-key-box').style.display = 'block';
                document.getElementById('latest-keys-text').innerText = generatedList.join('\n');
                btn.innerText = "⚡ GENERATE BATCH KEYS";
                btn.disabled = false;
                loadKeys();
            }).catch(error => {
                alert("Error generating keys: " + error.message);
                btn.innerText = "⚡ GENERATE BATCH KEYS";
                btn.disabled = false;
            });
        }

        function copyAllGeneratedKeys() {
            const text = document.getElementById('latest-keys-text').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("All keys copied to clipboard successfully!");
            });
        }

        function loadKeys() {
            const list = document.getElementById('keys-list');
            database.ref('access_keys').orderByChild('createdAt').limitToLast(30).on('value', (snapshot) => {
                list.innerHTML = "";
                let hasKeys = false;
                
                const keysArr = [];
                snapshot.forEach(child => {
                    keysArr.unshift({ key: child.key, data: child.val() });
                });

                keysArr.forEach(item => {
                    hasKeys = true;
                    const statusText = item.data.used ? "<span style='color:#ef4444; font-size:12px;'>USED</span>" : "<span style='color:#10b981; font-size:12px;'>ACTIVE</span>";
                    const cssClass = item.data.used ? "key-item used" : "key-item";
                    
                    list.innerHTML += `
                        <div class="${cssClass}">
                            <div style="font-family: monospace; font-size:15px;">${item.key}</div>
                            <div>
                                ${statusText}
                                ${!item.data.used ? `<button class="copy-btn" style="margin-left: 10px;" onclick="navigator.clipboard.writeText('${item.key}')">Copy</button>` : ''}
                            </div>
                        </div>
                    `;
                });

                if (!hasKeys) list.innerHTML = "<p style='color:#94a3b8;'>No access keys generated yet.</p>";
            });
        }

        function loadProfiles() {
            const grid = document.getElementById('profiles-grid');
            grid.innerHTML = "Loading...";
            
            database.ref('profiles').once('value').then((snapshot) => {
                grid.innerHTML = "";
                let hasProfiles = false;
                
                snapshot.forEach((childSnapshot) => {
                    const id = childSnapshot.key;
                    const data = childSnapshot.val();
                    hasProfiles = true;
                    
                    grid.innerHTML += `
                        <div class="card" id="card-${id}">
                            <img src="${data.photoBase64}" alt="Profile Photo">
                            <h3>${data.name}, ${data.age}</h3>
                            <p><strong>Country:</strong> ${data.country}</p>
                            <p><strong>WhatsApp:</strong> ${data.whatsapp}</p>
                            <button class="delete-btn" onclick="deleteProfile('${id}')">🗑️ Delete & Ban Profile</button>
                        </div>
                    `;
                });
                
                if (!hasProfiles) grid.innerHTML = "<p>No active profiles in the database.</p>";
            });
        }

        function deleteProfile(id) {
            if (confirm("Are you sure you want to permanently delete this profile from the network?")) {
                database.ref('profiles/' + id).remove().then(() => {
                    document.getElementById(`card-${id}`).style.display = 'none';
                }).catch(error => {
                    alert("Error deleting profile: " + error.message);
                });
            }
        }

        window.onload = () => {
            loadKeys();
        };
    </script>
</body>
</html>
