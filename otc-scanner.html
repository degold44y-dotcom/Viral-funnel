<!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Firebase Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyDf9TgoWF5OK0reS_KCumqqcuSpDx02UQg",
            authDomain: "probet-syndicate.firebaseapp.com",
            databaseURL: "https://probet-syndicate-default-rtdb.firebaseio.com",
            projectId: "probet-syndicate",
            storageBucket: "probet-syndicate.firebasestorage.app",
            messagingSenderId: "418866597682",
            appId: "1:418866597682:web:847007dbaf3c40452d912b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let maxScans = 5;
        let scansUsed = localStorage.getItem('ls_scans_used') ? parseInt(localStorage.getItem('ls_scans_used')) : 0;
        let isVIP = localStorage.getItem('ls_is_vip') === 'true';
        let hasAcceptedDisclaimer = localStorage.getItem('ls_disclaimer_accepted') === 'true';
        
        // Default Fallbacks (Will be overwritten live by your Admin Panel)
        let dynamicVIPKey = "PRO-OTC-777"; 
        let dynamicPaymentUrl = "https://selar.com";

        // Fetch live admin settings from Firebase on page load
        db.ref('adminSettings').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            if (data.vipKey) dynamicVIPKey = data.vipKey;
            if (data.paymentUrl) {
                dynamicPaymentUrl = data.paymentUrl;
                document.getElementById('payButton').href = dynamicPaymentUrl;
            }
            if (data.price) {
                document.getElementById('priceDisplay').innerText = data.price;
            }
        });

        function initApp() {
            if (!hasAcceptedDisclaimer) {
                document.getElementById('disclaimerModal').style.display = 'flex';
            } else {
                document.getElementById('disclaimerModal').style.display = 'none';
                checkPaywall();
            }
            updateCreditsDisplay();
        }

        function acceptDisclaimer() {
            hasAcceptedDisclaimer = true;
            localStorage.setItem('ls_disclaimer_accepted', 'true');
            
            const modal = document.getElementById('disclaimerModal');
            modal.style.opacity = '0';
            setTimeout(() => {
                modal.style.display = 'none';
                checkPaywall();
            }, 400);
        }

        function checkPaywall() {
            if (scansUsed >= maxScans && !isVIP) {
                document.getElementById('paywallArea').style.display = 'flex';
            }
        }

        function updateCreditsDisplay() {
            if (isVIP) {
                document.getElementById('creditsBadge').style.display = 'none';
                document.getElementById('vipBadge').style.display = 'block';
            } else {
                let scansLeft = maxScans - scansUsed;
                document.getElementById('scanCount').innerText = scansLeft;
            }
        }

        function verifyKey() {
            const inputKey = document.getElementById('licenseKey').value.trim();
            if (inputKey === dynamicVIPKey) {
                isVIP = true;
                localStorage.setItem('ls_is_vip', 'true');
                
                const paywall = document.getElementById('paywallArea');
                paywall.style.opacity = '0';
                setTimeout(() => {
                    paywall.style.display = 'none';
                    updateCreditsDisplay();
                    alert("VIP Unlocked Successfully! Welcome to Pro OTC.");
                }, 400);
            } else {
                alert("Invalid License Key. Please check your payment receipt email.");
            }
        }

        setInterval(() => {
            document.getElementById('liveClock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        function previewImage(event) {
            const input = event.target;
            const display = document.getElementById('fileNameDisplay');
            const previewContainer = document.getElementById('imagePreviewContainer');
            const previewImg = document.getElementById('imagePreview');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewContainer.style.display = 'block';
                    display.innerText = "✔️ File loaded: " + input.files[0].name;
                    document.getElementById('warningArea').style.display = 'none'; 
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function isValidChartImage(imgElement) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 100;
            canvas.height = 100;
            ctx.drawImage(imgElement, 0, 0, 100, 100);
            
            const data = ctx.getImageData(0, 0, 100, 100).data;
            let colorMap = {};
            let dominantCount = 0;

            for (let i = 0; i < data.length; i += 16) {
                let r = Math.floor(data[i] / 32);
                let g = Math.floor(data[i+1] / 32);
                let b = Math.floor(data[i+2] / 32);
                let key = r + "," + g + "," + b;
                colorMap[key] = (colorMap[key] || 0) + 1;
                if (colorMap[key] > dominantCount) dominantCount = colorMap[key];
            }
            return dominantCount >= 250; 
        }

        function attemptScan() {
            if (!isVIP && scansUsed >= maxScans) {
                document.getElementById('paywallArea').style.display = 'flex';
                return;
            }

            const input = document.getElementById('imageInput');
            if (input.files.length === 0) { alert("Upload a chart screenshot first!"); return; }

            const file = input.files[0];
            const previewImg = document.getElementById('imagePreview');
            
            const fileAgeMs = Date.now() - file.lastModified;
            if (fileAgeMs > 180000) {
                document.getElementById('warningMessage').innerHTML = `⚠️ OUTDATED CHART DETECTED.<br>File metadata shows this screenshot is old. You must take a LIVE screenshot right now to analyze current price action.`;
                document.getElementById('warningArea').style.display = 'block';
                return;
            }

            if (!isValidChartImage(previewImg)) {
                document.getElementById('warningMessage').innerHTML = `⚠️ INVALID IMAGE DETECTED.<br>No candlestick structure or valid background found. Please upload a real trading chart screenshot.`;
                document.getElementById('warningArea').style.display = 'block';
                return;
            }

            const now = new Date();
            const currentMin = now.getMinutes();
            
            let cleanAssetName = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ").toUpperCase();
            if (cleanAssetName.length > 18 || cleanAssetName.includes("SCREENSHOT") || cleanAssetName.includes("IMAGE")) {
                cleanAssetName = "OTC MARKET ASSET"; 
            }

            const baseMin = Math.floor(currentMin / 10) * 10;
            const signalMin = baseMin + 8;
            
            if (currentMin < signalMin) {
                let waitTime = new Date(now); waitTime.setMinutes(signalMin); waitTime.setSeconds(0);
                const timeString = waitTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                document.getElementById('warningMessage').innerHTML = `⚠️ ALGORITHMIC TIMING REJECTED.<br><br>The candle requires more structure. Wait until exactly <span style="color:#fff; font-size: 16px;">${timeString}</span> to upload and scan.`;
                document.getElementById('warningArea').style.display = 'block';
                return;
            }

            let execTime = new Date(now); 
            execTime.setMinutes(baseMin + 9); 
            execTime.setSeconds(57);
            
            let executionText = `
                <div style="text-transform: uppercase; font-size: 11px; color: var(--text-muted); margin-bottom: 5px;">Execution Protocol:</div>
                <span style="color:var(--neon-blue); font-size:24px; display:block; margin-bottom: 5px;">${execTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</span>
                <span style="color: #fff;">EXACTLY 9 MIN 57 SEC | 3-SEC EXPIRY</span>
            `;

            if (!isVIP) {
                scansUsed++;
                localStorage.setItem('ls_scans_used', scansUsed);
                updateCreditsDisplay();
            }

            document.getElementById('warningArea').style.display = 'none';
            document.getElementById('uploadContainer').style.display = 'none';
            document.getElementById('processingArea').style.display = 'block';

            const statusText = document.getElementById('statusText');
            setTimeout(() => { statusText.innerText = "Extracting Metadata & Time Signatures..."; }, 1000);
            setTimeout(() => { statusText.innerText = "Scanning Algorithmic Order Blocks..."; }, 2500);
            setTimeout(() => { statusText.innerText = "Calculating OTC Trend Probability..."; }, 4000);

            setTimeout(() => {
                document.getElementById('processingArea').style.display = 'none';
                document.getElementById('resultArea').style.display = 'block';
                document.getElementById('resetBtn').style.display = 'block';
                
                document.getElementById('signalAsset').innerText = "📊 " + cleanAssetName;

                const randomSeed = (now.getMinutes() * 60 + now.getSeconds() + file.size) % 100;
                
                const dirElement = document.getElementById('signalDirection');
                const execElement = document.getElementById('executionDetails');
                
                if (randomSeed < 15) {
                    dirElement.innerHTML = "⚠️ NO TRADE<br><span style='font-size: 14px; color: var(--text-muted);'>CONSOLIDATION DETECTED</span>";
                    dirElement.style.color = "var(--neon-yellow)";
                    execElement.innerHTML = "<span style='color: var(--neon-red);'>Market conditions unstable. Do not execute. Wait for next 10-minute block.</span>";
                    execElement.style.borderLeft = "4px solid var(--neon-red)";
                } else if (randomSeed < 57) {
                    dirElement.innerText = "🟢 CALL (UP)";
                    dirElement.style.color = "var(--neon-green)";
                    execElement.innerHTML = executionText;
                    execElement.style.borderLeft = "4px solid var(--neon-blue)";
                } else {
                    dirElement.innerText = "🔴 PUT (DOWN)";
                    dirElement.style.color = "var(--neon-red)";
                    execElement.innerHTML = executionText;
                    execElement.style.borderLeft = "4px solid var(--neon-blue)";
                }

            }, 5500);
        }

        function resetScanner() {
            document.getElementById('imageInput').value = "";
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('imagePreview').src = "";
            document.getElementById('fileNameDisplay').innerText = "No chart uploaded yet...";
            document.getElementById('resultArea').style.display = 'none';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('uploadContainer').style.display = 'block';
        }

        initApp();
    </script>
