<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCF Engine Control Center | Admin</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --panel-bg: #15181e;
            --neon-gold: #ffd700;
            --text-main: #ffffff;
            --text-muted: #8a99a8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .admin-box {
            background-color: var(--panel-bg);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        h2 {
            text-align: center;
            color: var(--neon-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        label { display: block; margin-bottom: 5px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
        input {
            width: 100%; padding: 12px; background-color: #0b0d10; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: var(--text-main); font-size: 13px; box-sizing: border-box; margin-bottom: 15px;
        }
        input:focus { outline: none; border-color: var(--neon-gold); }
        button {
            width: 100%; padding: 15px; border-radius: 10px; font-size: 14px;
            font-weight: bold; text-transform: uppercase; cursor: pointer; border: none;
            background: linear-gradient(90deg, #ff8c00, var(--neon-gold)); color: #000;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .login-screen { display: flex; flex-direction: column; justify-content: center; }
        .dashboard-content { display: none; }
    </style>
</head>
<body>
    <div class="admin-box">
        <!-- LOGIN -->
        <div id="loginScreen" class="login-screen">
            <h2>VCF Admin Login</h2>
            <label>Master Admin Key:</label>
            <input type="password" id="adminPassword" placeholder="Enter Master Key">
            <button onclick="loginAdmin()">Access VCF Dashboard</button>
        </div>

        <!-- DASHBOARD -->
        <div id="adminDashboard" class="dashboard-content">
            <h2>⚙️ VCF SaaS Manager</h2>
            
            <label style="color: var(--neon-gold);">Change Master Admin Key:</label>
            <input type="text" id="admMasterKey">

            <label style="color: #00e5ff;">Tier 1 Button Label:</label>
            <input type="text" id="admLabel1">
            <label>Tier 1 Checkout URL (Selar/Stripe/Flutterwave/etc):</label>
            <input type="text" id="admUrl1">

            <label style="color: #b52aff;">Tier 2 Button Label:</label>
            <input type="text" id="admLabel2">
            <label>Tier 2 Checkout URL:</label>
            <input type="text" id="admUrl2">

            <label style="color: #25D366;">Tier 3 Button Label:</label>
            <input type="text" id="admLabel3">
            <label>Tier 3 Checkout URL:</label>
            <input type="text" id="admUrl3">

            <button onclick="saveAdminConfig()">Save Configuration to Cloud</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDf9TgoWF5OK0reS_KCumqqcuSpDx02UQg",
            authDomain: "probet-syndicate.firebaseapp.com",
            databaseURL: "https://probet-syndicate-default-rtdb.firebaseio.com",
            projectId: "probet-syndicate",
            storageBucket: "probet-syndicate.firebasestorage.app",
            messagingSenderId: "418866597682",
            appId: "1:418866597682:web:847007dbaf3c40452d912b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentMasterKey = "PRO-VCF-777";
        db.ref('vcfAdmin/masterKey').on('value', (snapshot) => {
            if(snapshot.val()) currentMasterKey = snapshot.val();
        });

        function loginAdmin() {
            const pass = document.getElementById('adminPassword').value.trim();
            if(pass === currentMasterKey) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
                loadCurrentConfig();
            } else {
                alert("❌ Incorrect Master Key!");
            }
        }

        function loadCurrentConfig() {
            document.getElementById('admMasterKey').value = currentMasterKey;
            db.ref('vcfAdmin/config').once('value').then((snapshot) => {
                const config = snapshot.val() || {
                    label1: "🛒 5,000 Contacts ($2.00)", url1: "",
                    label2: "🛒 15,000 Contacts ($5.00)", url2: "",
                    label3: "🛒 50,000 Contacts ($10.00)", url3: ""
                };
                document.getElementById('admLabel1').value = config.label1;
                document.getElementById('admUrl1').value = config.url1;
                document.getElementById('admLabel2').value = config.label2;
                document.getElementById('admUrl2').value = config.url2;
                document.getElementById('admLabel3').value = config.label3;
                document.getElementById('admUrl3').value = config.url3;
            });
        }

        function saveAdminConfig() {
            const masterKey = document.getElementById('admMasterKey').value.trim();
            const label1 = document.getElementById('admLabel1').value.trim();
            const url1 = document.getElementById('admUrl1').value.trim();
            const label2 = document.getElementById('admLabel2').value.trim();
            const url2 = document.getElementById('admUrl2').value.trim();
            const label3 = document.getElementById('admLabel3').value.trim();
            const url3 = document.getElementById('admUrl3').value.trim();

            Promise.all([
                db.ref('vcfAdmin/masterKey').set(masterKey),
                db.ref('vcfAdmin/config').set({ label1, url1, label2, url2, label3, url3 })
            ]).then(() => {
                alert("✅ VCF Admin Configuration Updated Successfully!");
            });
        }
    </script>
</body>
</html>
