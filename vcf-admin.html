<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCF Engine - ADMIN</title>
    
    <!-- FIREBASE CLOUD DATABASE -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0c0b1a; color: #f8fafc; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid #3b82f6; padding-bottom: 15px; }
        h1 { margin: 0; color: #3b82f6; text-transform: uppercase; font-size: 24px; letter-spacing: 2px; }
        
        .panel-box { background: #1a162e; padding: 25px; border-radius: 12px; max-width: 600px; margin: 0 auto; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 5px; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0c0b1a; color: white; box-sizing: border-box; font-size: 15px; }
        
        .action-btn { background: #10b981; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .action-btn:hover { background: #059669; }
        
        .key-display { background: #0c0b1a; padding: 15px; font-family: monospace; font-size: 16px; color: #3b82f6; border: 1px dashed #3b82f6; margin-top: 15px; max-height: 200px; overflow-y: auto; text-align: center; white-space: pre-wrap; letter-spacing: 2px; }
        .copy-btn { background: #3b82f6; border: none; color: white; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-top: 10px; }
        
        .key-list-container { margin-top: 30px; max-width: 600px; margin: 30px auto; }
        .key-item { display: flex; justify-content: space-between; background: #1a162e; padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #10b981; align-items: center;}
        .key-item.used { border-left-color: #ef4444; opacity: 0.6; }
        .copy-small-btn { background: #3b82f6; border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚙️ VCF Engine Admin</h1>
        <p style="color: #94a3b8; font-size: 14px;">WhatsApp Contact Generator Key Panel</p>
    </div>

    <!-- KEY GENERATOR SECTION -->
    <div class="panel-box">
        <h2 style="margin-top: 0; color: #f8fafc;">Bulk Key Generator</h2>
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Generate VCF Access Keys to sell on WhatsApp or Selar.</p>
        
        <div class="input-group">
            <label>Quantity to Generate</label>
            <input type="number" id="key-quantity" value="20" min="1" max="200" style="text-align: center; font-size: 20px; font-weight: bold;">
        </div>
        
        <button class="action-btn" onclick="generateBulkKeys()">⚡ GENERATE VCF KEYS</button>
        
        <div id="new-key-box" style="display: none; margin-top: 20px;">
            <div class="key-display" id="latest-keys-text"></div>
            <button class="copy-btn" onclick="copyAllGeneratedKeys()">📋 COPY ALL KEYS</button>
        </div>
    </div>

    <!-- RECENT KEYS LIST -->
    <div class="key-list-container">
        <h3 style="border-bottom: 1px solid #333; padding-bottom: 10px;">Recent VCF Keys Database</h3>
        <div id="keys-list">Loading keys...</div>
    </div>

    <script>
        // 1. INITIALIZE FIREBASE (Using your exact database)
        const firebaseConfig = {
            apiKey: "AIzaSyAMuWAC8kNbGPdmlkngHUA7yG_f0vB_l4U",
            authDomain: "global-match-99b4e.firebaseapp.com",
            databaseURL: "https://global-match-99b4e-default-rtdb.firebaseio.com",
            projectId: "global-match-99b4e",
            storageBucket: "global-match-99b4e.firebasestorage.app",
            messagingSenderId: "816808980244",
            appId: "1:816808980244:web:832c3852ead2b707bb9c01"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 2. GENERATOR LOGIC
        function generateRandomString(length) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < length; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
            return result;
        }

        function generateBulkKeys() {
            const qty = parseInt(document.getElementById('key-quantity').value) || 10;
            const updates = {};
            let generatedList = [];

            for (let i = 0; i < qty; i++) {
                // Changed prefix to VCF so you instantly know what product this key is for
                const newKey = `VCF-${generateRandomString(4)}-${generateRandomString(4)}`;
                
                // Saving to a separate 'vcf_access_keys' node in Firebase
                updates['vcf_access_keys/' + newKey] = { used: false, createdAt: Date.now() + i };
                generatedList.push(newKey);
            }

            database.ref().update(updates).then(() => {
                document.getElementById('new-key-box').style.display = 'block';
                document.getElementById('latest-keys-text').innerText = generatedList.join('\n');
                loadKeys();
            }).catch(error => alert("Error generating keys: " + error.message));
        }

        function copyAllGeneratedKeys() {
            const text = document.getElementById('latest-keys-text').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("📋 All VCF keys copied successfully! You can paste them to your buyers now.");
            });
        }

        // 3. DATABASE DISPLAY LOGIC
        function loadKeys() {
            const list = document.getElementById('keys-list');
            
            // Reading specifically from the vcf_access_keys node
            database.ref('vcf_access_keys').orderByChild('createdAt').limitToLast(40).on('value', (snapshot) => {
                list.innerHTML = "";
                let hasKeys = false;
                const keysArr = [];
                snapshot.forEach(child => { keysArr.unshift({ key: child.key, data: child.val() }); });

                keysArr.forEach(item => {
                    hasKeys = true;
                    const statusText = item.data.used ? "<span style='color:#ef4444; font-size:12px; font-weight:bold;'>USED</span>" : "<span style='color:#10b981; font-size:12px; font-weight:bold;'>ACTIVE</span>";
                    
                    list.innerHTML += `
                        <div class="key-item ${item.data.used ? 'used' : ''}">
                            <div style="font-family: monospace; font-size:15px; color: #f8fafc;">${item.key}</div>
                            <div>
                                ${statusText} 
                                ${!item.data.used ? `<button class="copy-small-btn" style="margin-left:10px;" onclick="navigator.clipboard.writeText('${item.key}')">Copy</button>` : ''}
                            </div>
                        </div>
                    `;
                });
                
                if (!hasKeys) list.innerHTML = "<p style='color:#94a3b8; text-align:center;'>No VCF keys generated yet.</p>";
            });
        }

        window.onload = () => { loadKeys(); };
    </script>
</body>
</html>
