<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global VCF Engine</title>
    <style>
        :root {
            --bg-color: #121418;
            --panel-bg: #1a1d24;
            --neon-blue: #00e5ff;
            --neon-green: #00ff66;
            --neon-orange: #ff9900;
            --neon-purple: #b52aff;
            --text-main: #ffffff;
            --shadow-light: #242830;
            --shadow-dark: #101216;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .dashboard-3d {
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 30px 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
        }
        h2 {
            text-align: center;
            color: var(--neon-purple);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 22px;
        }
        
        .mode-selector {
            display: flex;
            background: #101216;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }
        .mode-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            color: #8a99a8;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .mode-btn.active-targeted {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .mode-btn.active-mixed {
            background: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 15px rgba(181, 42, 255, 0.4);
        }

        .input-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .input-group { flex: 1; margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 11px;
            color: #8a99a8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            background-color: var(--panel-bg);
            border: none;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }
        select:focus, input:focus { outline: none; box-shadow: inset 2px 2px 5px var(--shadow-dark), 0 0 10px rgba(0, 229, 255, 0.2); }
        
        .hint {
            font-size: 10px;
            color: var(--neon-purple);
            margin-top: 5px;
            display: none;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            background-color: var(--panel-bg);
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            transition: all 0.2s ease;
        }
        button:active { box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light); }
        
        .btn-generate { color: var(--neon-purple); border: 1px solid var(--neon-purple); }
        .btn-download { color: var(--neon-green); border: 1px solid var(--neon-green); display: none; }
        .btn-test { color: var(--neon-orange); border: 1px solid var(--neon-orange); display: none; margin-bottom: 0; }
        
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            background-color: var(--panel-bg);
            border: none;
            border-radius: 8px;
            color: #8a99a8;
            font-size: 12px;
            box-sizing: border-box;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            resize: none;
            margin-bottom: 15px;
            display: none;
        }
        
        #testLinksContainer { margin-top: 15px; display: none; background: #101216; padding: 10px; border-radius: 8px; font-size: 12px; }
        .test-link { display: block; color: var(--neon-orange); text-decoration: none; margin-bottom: 5px; padding: 5px; border-bottom: 1px solid #1a1d24; }
    </style>
</head>
<body>
    <div class="dashboard-3d">
        <h2>Global VCF Engine</h2>
        
        <div class="mode-selector">
            <div class="mode-btn active-targeted" id="btnTargeted" onclick="setMode('targeted')">🎯 Targeted</div>
            <div class="mode-btn" id="btnMixed" onclick="setMode('mixed')">🎲 Mixed (Wildcard)</div>
        </div>
        
        <div class="input-row">
            <div class="input-group">
                <label>Target Country</label>
                <select id="countrySelect" onchange="updateCountryDefaults()">
                    <option value="234">Nigeria (+234)</option>
                    <option value="44">UK (+44)</option>
                    <option value="1">USA/Canada (+1)</option>
                    <option value="61">Australia (+61)</option>
                    <option value="27">South Africa (+27)</option>
                    <option value="254">Kenya (+254)</option>
                    <option value="233">Ghana (+233)</option>
                    <option value="91">India (+91)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Quantity</label>
                <input type="number" id="quantity" placeholder="Unlimited..." value="10000">
            </div>
        </div>

        <div class="input-group">
            <label id="baseLabel">Starting Number (Without Code)</label>
            <input type="text" id="baseNumber" placeholder="e.g. 8030000000">
            <div class="hint" id="mixedHint">Type X for random digits (e.g. 77XXXXXXXX)</div>
        </div>

        <div class="input-group">
            <label>Contact Niche / Tag</label>
            <input type="text" id="nicheTag" placeholder="e.g. Global Lead">
        </div>

        <button class="btn-generate" onclick="generateNumbers()">1. Generate Contacts</button>
        
        <textarea id="previewBox" readonly placeholder="Preview will appear here..."></textarea>
        
        <button class="btn-download" id="downloadBtn" onclick="downloadVCF()">2. Download .VCF File</button>
        <button class="btn-test" id="testBtn" onclick="showTestLinks()">3. Test WA.ME Links</button>

        <div id="testLinksContainer"></div>
    </div>

    <script>
        let currentMode = 'targeted';
        let generatedContacts = [];

        // Auto-fill databases for a better user experience
        const defaultBases = {
            "234": "8030000000", "44": "7700000000", "1": "2125550000", 
            "61": "400000000", "27": "710000000", "254": "700000000", 
            "233": "240000000", "91": "9800000000"
        };
        const defaultWildcards = {
            "234": "803XXXXXXX", "44": "77XXXXXXXX", "1": "212XXXXXXX", 
            "61": "4XXXXXXXX", "27": "71XXXXXXX", "254": "70XXXXXXX", 
            "233": "24XXXXXXX", "91": "98XXXXXXXX"
        };

        function setMode(mode) {
            currentMode = mode;
            const baseInput = document.getElementById('baseNumber');
            const baseLabel = document.getElementById('baseLabel');
            const hint = document.getElementById('mixedHint');
            
            if (mode === 'targeted') {
                document.getElementById('btnTargeted').classList.add('active-targeted');
                document.getElementById('btnMixed').classList.remove('active-mixed');
                baseLabel.innerText = "Starting Number (Without Code)";
                baseInput.type = "number";
                hint.style.display = "none";
            } else {
                document.getElementById('btnMixed').classList.add('active-mixed');
                document.getElementById('btnTargeted').classList.remove('active-targeted');
                baseLabel.innerText = "Wildcard Format (Use 'X')";
                baseInput.type = "text";
                hint.style.display = "block";
            }
            updateCountryDefaults();
        }

        function updateCountryDefaults() {
            const code = document.getElementById('countrySelect').value;
            const baseInput = document.getElementById('baseNumber');
            
            if (currentMode === 'targeted') {
                baseInput.value = defaultBases[code] || "";
            } else {
                baseInput.value = defaultWildcards[code] || "";
            }
        }

        function generateNumbers() {
            const countryCode = document.getElementById('countrySelect').value;
            const quantityVal = document.getElementById('quantity').value.trim();
            const quantity = parseInt(quantityVal);
            const nicheTag = document.getElementById('nicheTag').value.trim() || "Lead";
            const baseInput = document.getElementById('baseNumber').value.trim().toUpperCase();
            
            if (!quantity || quantity <= 0) return alert("Please enter a valid Quantity.");
            if (!baseInput) return alert("Please enter a Base Number or Wildcard Format.");

            generatedContacts = [];
            let previewText = "";

            if (currentMode === 'targeted') {
                const baseNumber = parseInt(baseInput);
                if (isNaN(baseNumber)) return alert("Targeted mode requires a numeric Starting Number.");
                
                for (let i = 0; i < quantity; i++) {
                    const currentNum = baseNumber + i;
                    const fullNumber = `+${countryCode}${currentNum}`;
                    const rawPhone = `${countryCode}${currentNum}`;
                    generatedContacts.push({ name: `${nicheTag} ${i + 1}`, phone: fullNumber, rawPhone: rawPhone });
                    if (i < 10) previewText += `${nicheTag} ${i + 1}: ${fullNumber}\n`;
                }
            } else {
                // MIXED (WILDCARD) MODE
                if (!baseInput.includes('X')) return alert("Mixed mode requires at least one 'X' in the format (e.g. 77XXXXXXXX).");
                
                for (let i = 0; i < quantity; i++) {
                    let randomLocal = "";
                    for (let char of baseInput) {
                        if (char === 'X') {
                            randomLocal += Math.floor(Math.random() * 10).toString();
                        } else {
                            randomLocal += char;
                        }
                    }
                    
                    const fullNumber = `+${countryCode}${randomLocal}`;
                    const rawPhone = `${countryCode}${randomLocal}`;
                    generatedContacts.push({ name: `${nicheTag} ${i + 1}`, phone: fullNumber, rawPhone: rawPhone });
                    if (i < 10) previewText += `${nicheTag} ${i + 1}: ${fullNumber}\n`;
                }
            }

            document.getElementById('previewBox').style.display = "block";
            document.getElementById('previewBox').value = `Generated ${quantity.toLocaleString()} numbers successfully.\n\nPreview (First 10):\n${previewText}`;
            
            document.getElementById('downloadBtn').style.display = "block";
            document.getElementById('testBtn').style.display = "block";
            document.getElementById('testLinksContainer').style.display = "none";
        }

        function downloadVCF() {
            if (generatedContacts.length === 0) return;

            let vcfContent = '';
            generatedContacts.forEach(contact => {
                vcfContent += `BEGIN:VCARD\nVERSION:3.0\nFN:${contact.name}\nTEL;type=CELL;waid=${contact.rawPhone}:${contact.phone}\nEND:VCARD\n`;
            });

            const blob = new Blob([vcfContent], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const nicheTag = document.getElementById('nicheTag').value.trim() || "Leads";
            
            a.href = url;
            a.download = `${nicheTag}_Global_${generatedContacts.length}.vcf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showTestLinks() {
            if (generatedContacts.length === 0) return;
            const container = document.getElementById('testLinksContainer');
            container.innerHTML = '<label>Test Random Links (Checks if active on WhatsApp)</label>';
            
            for(let i = 0; i < 5; i++) {
                const randomIndex = Math.floor(Math.random() * generatedContacts.length);
                const contact = generatedContacts[randomIndex];
                const waLink = `https://wa.me/${contact.rawPhone}`;
                container.innerHTML += `<a href="${waLink}" target="_blank" class="test-link">🔗 Test: ${contact.name} (${contact.phone})</a>`;
            }
            container.style.display = "block";
        }

        // Initialize defaults on load
        updateCountryDefaults();
    </script>
</body>
</html>
