<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk WhatsApp Lead Generator</title>
    <style>
        :root {
            --bg-color: #121418;
            --panel-bg: #1a1d24;
            --neon-blue: #00e5ff;
            --neon-green: #00ff66;
            --neon-orange: #ff9900;
            --text-main: #ffffff;
            --shadow-light: #242830;
            --shadow-dark: #101216;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .dashboard-3d {
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
        }
        h2 {
            text-align: center;
            color: var(--neon-blue);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .input-group { flex: 1; margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 11px;
            color: #8a99a8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: var(--panel-bg);
            border: none;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
        }
        input:focus { outline: none; box-shadow: inset 2px 2px 5px var(--shadow-dark), 0 0 10px rgba(0, 229, 255, 0.2); }
        
        button {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            background-color: var(--panel-bg);
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            transition: all 0.2s ease;
        }
        button:active { box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light); }
        
        .btn-generate { color: var(--neon-blue); border-color: var(--neon-blue); }
        .btn-download { color: var(--neon-green); border-color: var(--neon-green); display: none; }
        .btn-test { color: var(--neon-orange); border-color: var(--neon-orange); display: none; margin-bottom: 0; }
        
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            background-color: var(--panel-bg);
            border: none;
            border-radius: 8px;
            color: #8a99a8;
            font-size: 12px;
            box-sizing: border-box;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            resize: none;
            margin-bottom: 15px;
            display: none;
        }
        
        #testLinksContainer {
            margin-top: 15px;
            display: none;
            background: #101216;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
        }
        .test-link {
            display: block;
            color: var(--neon-orange);
            text-decoration: none;
            margin-bottom: 5px;
            padding: 5px;
            border-bottom: 1px solid #1a1d24;
        }
        .test-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="dashboard-3d">
        <h2>Bulk WA Generator</h2>
        
        <div class="input-row">
            <div class="input-group">
                <label>Country Code</label>
                <input type="number" id="countryCode" placeholder="e.g. 234">
            </div>
            <div class="input-group">
                <label>Quantity</label>
                <input type="number" id="quantity" value="5000">
            </div>
        </div>

        <div class="input-group">
            <label>Base Phone Number (Without Country Code)</label>
            <input type="number" id="baseNumber" placeholder="e.g. 8030000000">
        </div>

        <div class="input-group">
            <label>Contact Niche / Tag</label>
            <input type="text" id="nicheTag" placeholder="e.g. UK Job Lead">
        </div>

        <button class="btn-generate" onclick="generateNumbers()">1. Generate Contacts</button>
        
        <textarea id="previewBox" readonly placeholder="Preview will appear here..."></textarea>
        
        <button class="btn-download" id="downloadBtn" onclick="downloadVCF()">2. Download .VCF File</button>
        <button class="btn-test" id="testBtn" onclick="showTestLinks()">3. Test WA.ME Links</button>

        <div id="testLinksContainer"></div>
    </div>

    <script>
        let generatedContacts = [];

        function generateNumbers() {
            const countryCode = document.getElementById('countryCode').value.trim();
            const baseNumber = parseInt(document.getElementById('baseNumber').value.trim());
            const quantity = parseInt(document.getElementById('quantity').value.trim());
            const nicheTag = document.getElementById('nicheTag').value.trim() || "Lead";

            if (!countryCode || !baseNumber || !quantity) {
                alert("Please fill in Country Code, Base Number, and Quantity.");
                return;
            }

            generatedContacts = [];
            let previewText = "";

            for (let i = 0; i < quantity; i++) {
                const currentNum = baseNumber + i;
                const fullNumber = `+${countryCode}${currentNum}`;
                const contactName = `${nicheTag} ${i + 1}`;
                
                generatedContacts.push({ name: contactName, phone: fullNumber, rawPhone: `${countryCode}${currentNum}` });
                
                if (i < 10) {
                    previewText += `${contactName}: ${fullNumber}\n`;
                }
            }

            document.getElementById('previewBox').style.display = "block";
            document.getElementById('previewBox').value = `Generated ${quantity} numbers.\n\nPreview (First 10):\n${previewText}`;
            
            document.getElementById('downloadBtn').style.display = "block";
            document.getElementById('testBtn').style.display = "block";
            document.getElementById('testLinksContainer').style.display = "none";
        }

        function downloadVCF() {
            if (generatedContacts.length === 0) return;

            let vcfContent = '';
            generatedContacts.forEach(contact => {
                vcfContent += `BEGIN:VCARD\nVERSION:3.0\nFN:${contact.name}\nTEL:${contact.phone}\nEND:VCARD\n`;
            });

            const blob = new Blob([vcfContent], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const nicheTag = document.getElementById('nicheTag').value.trim() || "Leads";
            
            a.href = url;
            a.download = `${nicheTag}_${generatedContacts.length}.vcf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showTestLinks() {
            if (generatedContacts.length === 0) return;
            
            const container = document.getElementById('testLinksContainer');
            container.innerHTML = '<label>Test Random Links (Checks if active on WhatsApp)</label>';
            
            // Grab 5 random numbers from the generated list to test
            for(let i = 0; i < 5; i++) {
                const randomIndex = Math.floor(Math.random() * generatedContacts.length);
                const contact = generatedContacts[randomIndex];
                const waLink = `https://wa.me/${contact.rawPhone}`;
                
                container.innerHTML += `<a href="${waLink}" target="_blank" class="test-link">🔗 Test: ${contact.name} (${contact.phone})</a>`;
            }
            
            container.style.display = "block";
        }
    </script>
</body>
</html>
