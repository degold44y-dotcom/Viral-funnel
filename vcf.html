<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global VCF Engine</title>
    <style>
        :root {
            --bg-color: #0b0d10;
            --panel-bg: #15181e;
            --card-bg: #1c2028;
            --neon-blue: #00e5ff;
            --neon-green: #25D366;
            --neon-orange: #ff9900;
            --neon-purple: #b52aff;
            --text-main: #ffffff;
            --text-muted: #8a99a8;
            --border-glow: rgba(0, 229, 255, 0.3);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .dashboard-ui {
            background-color: var(--panel-bg);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
        }
        h2 {
            text-align: center;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 22px;
            font-weight: 800;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.02);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .step-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }
        .step-title span {
            background: var(--neon-blue);
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
        }

        .mode-selector {
            display: flex;
            background: #0b0d10;
            border-radius: 10px;
            padding: 4px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
        }
        .mode-btn.active-targeted { background: var(--neon-blue); color: #000; }
        .mode-btn.active-mixed { background: var(--neon-purple); color: #fff; }

        .input-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .input-group { flex: 1; position: relative; }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        
        /* Mobile-Safe Premium Inputs */
        select, input {
            width: 100%;
            padding: 14px 12px;
            background-color: #0b0d10;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            transition: 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
        }
        
        /* Custom Clickable Dropdown Arrow */
        select {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300e5ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 40px;
        }
        
        .hint { font-size: 11px; color: var(--neon-purple); margin-top: 6px; display: none; }

        button {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }
        .btn-generate { background: var(--neon-blue); color: #000; box-shadow: 0 0 20px rgba(0,229,255,0.3); }
        .btn-generate:active { transform: scale(0.98); }
        .btn-download { background: var(--neon-green); color: #000; box-shadow: 0 0 20px rgba(37,211,102,0.3); display: none; }
        .btn-test { background: transparent; color: var(--text-main); border: 1px solid rgba(255,255,255,0.2); display: none; margin-bottom: 0; }
        
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            background-color: #0b0d10;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            color: var(--neon-green);
            font-size: 12px;
            font-family: monospace;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 15px;
            display: none;
        }
        
        #testLinksContainer { margin-top: 15px; display: none; }
        .test-link { 
            display: flex; align-items: center; color: var(--text-main); 
            text-decoration: none; margin-bottom: 8px; padding: 12px; 
            background: #0b0d10; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
        }
        .wa-icon { margin-right: 12px; fill: var(--neon-green); width: 18px; height: 18px; }
    </style>
</head>
<body>
    <div class="dashboard-ui">
        <h2>Global Lead Engine</h2>
        
        <!-- STEP 1: ENGINE MODE -->
        <div class="card">
            <div class="step-title"><span>1</span> Select Engine Mode</div>
            <div class="mode-selector">
                <div class="mode-btn active-targeted" id="btnTargeted" onclick="setMode('targeted')">🎯 Targeted</div>
                <!-- Renamed to Mixed -->
                <div class="mode-btn" id="btnMixed" onclick="setMode('mixed')">🎲 Mixed</div>
            </div>
        </div>
        
        <!-- STEP 2: PARAMETERS -->
        <div class="card">
            <div class="step-title"><span>2</span> Set Parameters</div>
            <div class="input-row">
                <div class="input-group">
                    <label>Country Network</label>
                    <select id="countrySelect" onchange="updateCountryDefaults()">
                        <!-- Javascript Loads this instantly -->
                    </select>
                </div>
                <div class="input-group">
                    <label>Quantity</label>
                    <input type="number" id="quantity" value="10000">
                </div>
            </div>

            <!-- Added an ID to this container so we can hide it in Mixed Mode -->
            <div class="input-group" id="baseNumberContainer" style="margin-bottom: 15px;">
                <label id="baseLabel">Starting Number (Without Code)</label>
                <input type="text" id="baseNumber" placeholder="e.g. 8030000000">
                <div class="hint" id="mixedHint">Type X for random digits (e.g. 77XXXXXXXX)</div>
            </div>

            <div class="input-group">
                <label>Contact File Tag (Name)</label>
                <input type="text" id="nicheTag" placeholder="e.g. Global Lead">
            </div>
        </div>

        <!-- STEP 3: EXECUTE -->
        <div class="card" style="margin-bottom: 0;">
            <div class="step-title"><span>3</span> Execute & Export</div>
            <button class="btn-generate" onclick="generateNumbers()">Run Generator</button>
            <textarea id="previewBox" readonly></textarea>
            <button class="btn-download" id="downloadBtn" onclick="downloadVCF()">Export .VCF File</button>
            <button class="btn-test" id="testBtn" onclick="showTestLinks()">Verify Numbers (WhatsApp)</button>
            <div id="testLinksContainer"></div>
        </div>

    </div>

    <script>
        let currentMode = 'targeted';
        let generatedContacts = [];

        const countryString = "Afghanistan:93,Albania:355,Algeria:213,Andorra:376,Angola:244,Argentina:54,Armenia:374,Austria:43,Azerbaijan:994,Bahamas:1,Bahrain:973,Bangladesh:880,Belarus:375,Belgium:32,Belize:501,Benin:229,Bhutan:975,Bolivia:591,Bosnia:387,Botswana:267,Brazil:55,Brunei:673,Bulgaria:359,Burkina Faso:226,Burundi:257,Cambodia:855,Cameroon:237,Canada:1,Cape Verde:238,Central African Rep:236,Chad:235,Chile:56,China:86,Colombia:57,Comoros:269,Congo:242,Costa Rica:506,Croatia:385,Cuba:53,Cyprus:357,Czech Republic:420,Denmark:45,Djibouti:253,Dominican Rep:1,Ecuador:593,Egypt:20,El Salvador:503,Equatorial Guinea:240,Eritrea:291,Estonia:372,Ethiopia:251,Fiji:679,Finland:358,France:33,Gabon:241,Gambia:220,Georgia:995,Germany:49,Greece:30,Guatemala:502,Guinea:224,Guyana:592,Haiti:509,Honduras:504,Hong Kong:852,Hungary:36,Iceland:354,Indonesia:62,Iran:98,Iraq:964,Ireland:353,Israel:972,Italy:39,Ivory Coast:225,Jamaica:1,Japan:81,Jordan:962,Kazakhstan:7,Kuwait:965,Kyrgyzstan:996,Laos:856,Latvia:371,Lebanon:961,Lesotho:266,Liberia:231,Libya:218,Lithuania:370,Luxembourg:352,Macau:853,Macedonia:389,Madagascar:261,Malawi:265,Malaysia:60,Maldives:960,Mali:223,Malta:356,Mauritania:222,Mauritius:230,Mexico:52,Moldova:373,Monaco:377,Mongolia:976,Montenegro:382,Morocco:212,Mozambique:258,Myanmar:95,Namibia:264,Nepal:977,Netherlands:31,New Zealand:64,Nicaragua:505,Niger:227,North Korea:850,Norway:47,Oman:968,Pakistan:92,Palestine:970,Panama:507,Papua New Guinea:675,Paraguay:595,Peru:51,Philippines:63,Poland:48,Portugal:351,Qatar:974,Romania:40,Russia:7,Rwanda:250,Saudi Arabia:966,Senegal:221,Serbia:381,Seychelles:248,Sierra Leone:232,Singapore:65,Slovakia:421,Slovenia:386,Somalia:252,South Korea:82,Spain:34,Sri Lanka:94,Sudan:249,Suriname:597,Swaziland:268,Sweden:46,Switzerland:41,Syria:963,Taiwan:886,Tajikistan:992,Tanzania:255,Thailand:66,Togo:228,Trinidad and Tobago:1,Tunisia:216,Turkey:90,Turkmenistan:993,Uganda:256,Ukraine:380,UAE:971,Uruguay:598,Uzbekistan:998,Venezuela:58,Vietnam:84,Yemen:967,Zambia:260,Zimbabwe:263";

        // Bulletproof fast-load trigger
        document.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('countrySelect');
            const topCountries = ["Nigeria:234", "USA/Canada:1", "UK:44", "South Africa:27", "Ghana:233", "Kenya:254", "India:91", "Australia:61"];
            
            topCountries.forEach(c => {
                let [n, code] = c.split(':');
                select.add(new Option(`🔥 ${n} (+${code})`, code));
            });
            
            select.add(new Option("──────────", "", false, false));
            select.options[select.options.length-1].disabled = true;

            countryString.split(',').forEach(c => {
                let [n, code] = c.split(':');
                select.add(new Option(`${n} (+${code})`, code));
            });
            
            select.value = "234";
            updateCountryDefaults();
        });

        const defaultBases = { "234": "8030000000", "44": "7700000000", "1": "2125550000", "61": "400000000", "27": "710000000", "254": "700000000", "233": "240000000", "91": "9800000000" };
        const defaultWildcards = { "234": "803XXXXXXX", "44": "77XXXXXXXX", "1": "212XXXXXXX", "61": "4XXXXXXXX", "27": "71XXXXXXX", "254": "70XXXXXXX", "233": "24XXXXXXX", "91": "98XXXXXXXX" };

        function setMode(mode) {
            currentMode = mode;
            const baseContainer = document.getElementById('baseNumberContainer');
            
            if (mode === 'targeted') {
                document.getElementById('btnTargeted').classList.add('active-targeted');
                document.getElementById('btnMixed').classList.remove('active-mixed');
                // Show the input box again for targeted mode
                baseContainer.style.display = "block";
            } else {
                document.getElementById('btnMixed').classList.add('active-mixed');
                document.getElementById('btnTargeted').classList.remove('active-targeted');
                // Completely hide the input box for mixed mode
                baseContainer.style.display = "none";
            }
            updateCountryDefaults();
        }

        function updateCountryDefaults() {
            const code = document.getElementById('countrySelect').value;
            const baseInput = document.getElementById('baseNumber');
            if (currentMode === 'targeted') {
                baseInput.value = defaultBases[code] || "1000000000";
            } else {
                baseInput.value = defaultWildcards[code] || "XXXXXXXXXX";
            }
        }

        function generateNumbers() {
            const countryCode = document.getElementById('countrySelect').value;
            const quantity = parseInt(document.getElementById('quantity').value.trim());
            const nicheTag = document.getElementById('nicheTag').value.trim() || "Lead";
            const baseInput = document.getElementById('baseNumber').value.trim().toUpperCase();
            
            if (!quantity || quantity <= 0) return alert("Please enter a valid Quantity.");
            // Only require the baseInput box if they are using Targeted Mode
            if (currentMode === 'targeted' && !baseInput) return alert("Please enter a Base Number.");

            generatedContacts = [];
            let previewText = "";

            if (currentMode === 'targeted') {
                const baseNumber = parseInt(baseInput);
                if (isNaN(baseNumber)) return alert("Targeted mode
