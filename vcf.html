<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global VCF Engine</title>
    <style>
        :root {
            --bg-color: #121418;
            --panel-bg: #1a1d24;
            --neon-blue: #00e5ff;
            --neon-green: #00ff66;
            --neon-orange: #ff9900;
            --neon-purple: #b52aff;
            --text-main: #ffffff;
            --shadow-light: #242830;
            --shadow-dark: #101216;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .dashboard-3d {
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 30px 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 10px 10px 20px var(--shadow-dark), -10px -10px 20px var(--shadow-light);
        }
        h2 {
            text-align: center;
            color: var(--neon-purple);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 22px;
        }
        
        .mode-selector {
            display: flex;
            background: #101216;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
        }
        .mode-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            color: #8a99a8;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .mode-btn.active-targeted {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .mode-btn.active-mixed {
            background: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 15px rgba(181, 42, 255, 0.4);
        }

        .input-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .input-group { flex: 1; margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 11px;
            color: #8a99a8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            background-color: var(--panel-bg);
            border: none;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
        }
        select:focus, input:focus { outline: none; box-shadow: inset 2px 2px 5px var(--shadow-dark), 0 0 10px rgba(0, 229, 255, 0.2); }
        
        .hint {
            font-size: 10px;
            color: var(--neon-purple);
            margin-top: 5px;
            display: none;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            background-color: var(--panel-bg);
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            transition: all 0.2s ease;
        }
        button:active { box-shadow: inset 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light); }
        
        .btn-generate { color: var(--neon-purple); border: 1px solid var(--neon-purple); }
        .btn-download { color: var(--neon-green); border: 1px solid var(--neon-green); display: none; }
        .btn-test { color: var(--neon-orange); border: 1px solid var(--neon-orange); display: none; margin-bottom: 0; }
        
        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            background-color: var(--panel-bg);
            border: none;
            border-radius: 8px;
            color: #8a99a8;
            font-size: 12px;
            box-sizing: border-box;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            resize: none;
            margin-bottom: 15px;
            display: none;
        }
        
        #testLinksContainer { margin-top: 15px; display: none; background: #101216; padding: 10px; border-radius: 8px; font-size: 12px; }
        .test-link { 
            display: flex; 
            align-items: center; 
            color: var(--neon-orange); 
            text-decoration: none; 
            margin-bottom: 5px; 
            padding: 8px; 
            border-bottom: 1px solid #1a1d24; 
            transition: 0.2s;
        }
        .test-link:hover { background: #1a1d24; border-radius: 5px; }
        .wa-icon { margin-right: 8px; fill: #25D366; width: 16px; height: 16px; }
    </style>
</head>
<body>
    <div class="dashboard-3d">
        <h2>Global VCF Engine</h2>
        
        <div class="mode-selector">
            <div class="mode-btn active-targeted" id="btnTargeted" onclick="setMode('targeted')">🎯 Targeted</div>
            <div class="mode-btn" id="btnMixed" onclick="setMode('mixed')">🎲 Mixed (Wildcard)</div>
        </div>
        
        <div class="input-row">
            <div class="input-group">
                <label>Target Country</label>
                <select id="countrySelect" onchange="updateCountryDefaults()">
                    <!-- Populated by JavaScript -->
                </select>
            </div>
            <div class="input-group">
                <label>Quantity</label>
                <input type="number" id="quantity" placeholder="Unlimited..." value="10000">
            </div>
        </div>

        <div class="input-group">
            <label id="baseLabel">Starting Number (Without Code)</label>
            <input type="text" id="baseNumber" placeholder="e.g. 8030000000">
            <div class="hint" id="mixedHint">Type X for random digits (e.g. 77XXXXXXXX)</div>
        </div>

        <div class="input-group">
            <label>Contact Niche / Tag</label>
            <input type="text" id="nicheTag" placeholder="e.g. Global Lead">
        </div>

        <button class="btn-generate" onclick="generateNumbers()">1. Generate Contacts</button>
        
        <textarea id="previewBox" readonly placeholder="Preview will appear here..."></textarea>
        
        <button class="btn-download" id="downloadBtn" onclick="downloadVCF()">2. Download .VCF File</button>
        <button class="btn-test" id="testBtn" onclick="showTestLinks()">3. Test WA.ME Links</button>

        <div id="testLinksContainer"></div>
    </div>
